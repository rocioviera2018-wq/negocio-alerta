
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35">
<title>Negocio Alerta 2.0</title>
<style>
:root{--green:#173f35;--green2:#226b50;--light:#e8f4ed;--bg:#f3f6f4;--white:#fff;--text:#20332b;--muted:#718078;--red:#b42318;--border:#dfe7e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
header{background:var(--green);color:white;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.brand{font-size:20px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.8}
.header-actions{display:flex;gap:8px}
.iconbtn{background:#ffffff1c;color:white;border:1px solid #ffffff35;border-radius:10px;padding:10px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1400px;margin:auto}
.sidebar{padding:16px 10px;background:white;border-right:1px solid var(--border);min-height:calc(100vh - 68px)}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:0;background:transparent;border-radius:12px;color:var(--text);margin-bottom:4px;font-weight:600}
.nav.active,.nav:hover{background:var(--light);color:var(--green2)}
svg{width:21px;height:21px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:24px;min-width:0}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 14px}
p{color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:22px 0}
.card,.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:17px;min-width:0}
.stat{display:flex;align-items:center;gap:12px}
.stat-icon{background:var(--light);color:var(--green2);border-radius:12px;padding:12px}
.stat strong{font-size:23px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.btn{border:0;background:var(--green);color:white;padding:11px 15px;border-radius:10px;font-weight:650}
.btn:hover{filter:brightness(1.12)}
.btn.secondary{background:var(--light);color:var(--green)}
.btn.danger{background:#fff0ef;color:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfdad2;border-radius:10px;background:white;color:var(--text);outline-color:var(--green2)}
label{font-size:13px;font-weight:650;display:block;margin-bottom:6px}
.field{margin-bottom:13px;min-width:0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.search{max-width:380px}
.tablewrap{overflow:auto;background:white;border:1px solid var(--border);border-radius:13px}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:13px}
th{background:#f7faf8;color:#526259}
tr:last-child td{border-bottom:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.smallbtn{border:1px solid var(--border);background:white;padding:7px 9px;border-radius:8px}
.badge{display:inline-block;background:var(--light);color:var(--green2);padding:4px 8px;border-radius:20px;font-size:12px}
.badge.low{background:#fff0d7;color:#8a4b08}
.empty{text-align:center;padding:28px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:10px;background:#fff4d8;color:#79520b;margin:12px 0;font-size:13px}
.bottomnav{display:none}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
@media(max-width:800px){
 .layout{display:block}.sidebar{display:none}main{padding:17px 13px 92px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:13px}.stat{gap:9px}.stat-icon{padding:9px}.stat strong{font-size:20px}
 .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:white;border-top:1px solid var(--border);padding:7px 3px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
 .bottomnav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;align-items:center;flex-direction:column;gap:3px;padding:5px 2px;min-width:0}
 .bottomnav button.active{color:var(--green2);font-weight:800}.bottomnav svg{width:20px;height:20px}
 .formgrid{grid-template-columns:1fr}h1{font-size:23px}
}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 8 9 5 9-5M3 8v10l9 5 9-5V8M12 13v10"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 3h2l3 12h10l3-9H6M10 20h.01M18 20h.01"/></symbol>
<symbol id="i-stock" viewBox="0 0 24 24"><path d="M3 7h18v14H3zM7 7V4h10v3M3 12h18M10 12v3h4v-3"/></symbol>
<symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 4h16v5a3 3 0 0 0 0 6v5H4v-5a3 3 0 0 0 0-6zM9 8h6M9 12h6M9 16h3"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.6a8 8 0 0 1-2 .9l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-2-.9l-1.7.6-1.5-2.6L6.3 15a8 8 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.6a8 8 0 0 1 2-.9l.3-1.8h3l.3 1.8a8 8 0 0 1 2 .9l1.7-.6 1.5 2.6L19.4 13a8 8 0 0 1 0 2Z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</svg>
<div class="app">
<header>
 <div class="brand">🟢 Negocio Alerta <small>Versión 2.0 · Gestión local</small></div>
 <div class="header-actions">
  <button class="iconbtn" onclick="navigate('ajustes')" aria-label="Ajustes"><svg><use href="#i-settings"/></svg></button>
 </div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>
<main id="main" aria-live="polite"></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
</div>
<script>
"use strict";
const KEY="negocio_alerta_2_datos";
const defaults={products:[],clients:[],sales:[],settings:{business:"Mi negocio",currency:"$"}};
let db=loadDB(),page="inicio",searchTerm="";
function loadDB(){
 try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.products)?{...defaults,...d,settings:{...defaults.settings,...d.settings}}:structuredClone(defaults)}
 catch(e){return structuredClone(defaults)}
}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert("No se pudieron guardar los datos. Revisá el espacio disponible del navegador.");return false}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return (db.settings.currency||"$")+" "+Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const menus=[
 ["inicio","Inicio","i-home"],["productos","Productos","i-box"],["clientes","Clientes","i-users"],
 ["ventas","Ventas","i-cart"],["stock","Stock","i-stock"],["tickets","Tickets","i-ticket"],["ajustes","Ajustes","i-settings"]
];
function icon(id){return `<svg aria-hidden="true"><use href="#${id}"/></svg>`}
function navHTML(){return menus.map(([id,label,ico])=>`<button class="nav ${page===id?"active":""}" onclick="navigate('${id}')">${icon(ico)}<span>${label}</span></button>`).join("")}
function updateNav(){
 document.getElementById("sidebar").innerHTML=navHTML();
 document.getElementById("bottomnav").innerHTML=menus.filter(x=>["inicio","productos","clientes","ventas","stock"].includes(x[0])).map(([id,label,ico])=>`<button class="${page===id?"active":""}" onclick="navigate('${id}')">${icon(ico)}<span>${label}</span></button>`).join("");
}
function navigate(p){page=p;searchTerm="";render()}
function heading(title,desc){return `<h1>${title}</h1><p>${desc}</p>`}
function toolbar(addLabel,addAction){return `<div class="toolbar"><input class="search" placeholder="Buscar..." value="${esc(searchTerm)}" oninput="searchTerm=this.value;renderContentOnly()" aria-label="Buscar">${addLabel?`<button class="btn" onclick="${addAction}">${icon("i-plus")} ${addLabel}</button>`:""}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Todavía no hay registros.</td></tr>`}</tbody></table></div>`}
function filterRows(items,...fields){let q=searchTerm.toLowerCase().trim();return items.filter(x=>!q||fields.some(f=>String(x[f]??"").toLowerCase().includes(q)))}
function render(){
 updateNav();
 document.getElementById("main").innerHTML=content();
}
function renderContentOnly(){document.getElementById("main").innerHTML=content()}
function content(){
 if(page==="inicio")return home();
 if(page==="productos")return productsPage();
 if(page==="clientes")return clientsPage();
 if(page==="ventas")return salesPage();
 if(page==="stock")return stockPage();
 if(page==="tickets")return ticketsPage();
 if(page==="ajustes")return settingsPage();
 return home()
}
function home(){
 const total=db.products.length,low=db.products.filter(p=>Number(p.stock)<=Number(p.min||0)).length;
 const today=new Date().toLocaleDateString("en-CA");
 const salesToday=db.sales.filter(s=>s.date.slice(0,10)===today);
 const revenue=salesToday.reduce((a,s)=>a+Number(s.total),0);
 return `${heading("Panel principal","Resumen de ${esc(db.settings.business)}")}
 <div class="cards">
  <div class="card stat"><div class="stat-icon">${icon("i-box")}</div><div><strong>${total}</strong><span>Productos</span></div></div>
  <div class="card stat"><div class="stat-icon">${icon("i-users")}</div><div><strong>${db.clients.length}</strong><span>Clientes</span></div></div>
  <div class="card stat"><div class="stat-icon">${icon("i-cart")}</div><div><strong>${salesToday.length}</strong><span>Ventas de hoy</span></div></div>
  <div class="card stat"><div class="stat-icon">${icon("i-stock")}</div><div><strong>${low}</strong><span>Alertas de stock</span></div></div>
 </div>
 <section class="panel"><h2>Accesos rápidos</h2><div class="toolbar">
 <button class="btn" onclick="navigate('productos')">${icon("i-box")} Productos</button>
 <button class="btn secondary" onclick="navigate('clientes')">${icon("i-users")} Clientes</button>
 <button class="btn secondary" onclick="navigate('ventas')">${icon("i-cart")} Nueva venta</button>
 <button class="btn secondary" onclick="navigate('tickets')">${icon("i-ticket")} Tickets</button></div>
 <hr><p>Facturación registrada hoy</p><h2>${money(revenue)}</h2></section>
 <div class="panel" style="margin-top:16px"><h2>Productos con poco stock</h2>${table(["Producto","Existencia","Mínimo"],db.products.filter(p=>Number(p.stock)<=Number(p.min||0)).slice(0,8).map(p=>`<tr><td>${esc(p.name)}</td><td><span class="badge low">${p.stock}</span></td><td>${p.min||0}</td></tr>`).join(""))}</div>
 <p class="muted">Los datos de esta versión se guardan en este navegador. Exportá una copia de seguridad desde Ajustes.</p>`;
}
function productsPage(){
 const items=filterRows(db.products,"name","sku","category");
 return `${heading("Productos","Administrá precios, códigos y existencias.")}${toolbar("Agregar producto","productForm()")}
 ${table(["Producto","Código","Precio","Stock","Acciones"],items.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.category||"Sin categoría")}</span></td><td>${esc(p.sku||"—")}</td><td>${money(p.price)}</td><td>${Number(p.stock)}</td><td><div class="actions"><button class="smallbtn" onclick="productForm('${p.id}')">Editar</button><button class="smallbtn" onclick="deleteItem('products','${p.id}')">Eliminar</button></div></td></tr>`).join(""))}`;
}
function clientsPage(){
 const items=filterRows(db.clients,"name","phone","email");
 return `${heading("Clientes","Guardá y consultá los datos de tus clientes.")}${toolbar("Agregar cliente","clientForm()")}
 ${table(["Nombre","Teléfono","Correo","Acciones"],items.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||"—")}</td><td>${esc(c.email||"—")}</td><td><div class="actions"><button class="smallbtn" onclick="clientForm('${c.id}')">Editar</button><button class="smallbtn" onclick="deleteItem('clients','${c.id}')">Eliminar</button></div></td></tr>`).join(""))}`;
}
function salesPage(){
 const options=db.products.filter(p=>Number(p.stock)>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (stock ${p.stock})</option>`).join("");
 return `${heading("Ventas","Registrá ventas y descontá productos del stock automáticamente.")}
 <section class="panel"><h2>Nueva venta</h2>
 <form onsubmit="createSale(event)">
 <div class="formgrid"><div class="field"><label>Producto</label><select id="saleProduct" required>${options||'<option value="">Primero agregá productos con stock</option>'}</select></div>
 <div class="field"><label>Cantidad</label><input id="saleQty" type="number" min="1" step="1" value="1" required></div>
 <div class="field"><label>Cliente (opcional)</label><select id="saleClient"><option value="">Venta general</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
 <div class="field"><label>Medio de pago</label><select id="salePayment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></div></div>
 <button class="btn" type="submit">Registrar venta</button></form></section>
 <section class="panel" style="margin-top:16px"><h2>Historial de ventas</h2>
 ${table(["Fecha","Producto","Cantidad","Total","Pago","Ticket"],db.sales.slice().reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString("es-AR")}</td><td>${esc(s.productName)}<br><span class="muted">${esc(s.clientName||"Venta general")}</span></td><td>${s.qty}</td><td>${money(s.total)}</td><td>${esc(s.payment)}</td><td><button class="smallbtn" onclick="printTicket('${s.id}')">Ver ticket</button></td></tr>`).join(""))}</section>`;
}
function stockPage(){
 const items=filterRows(db.products,"name","sku").slice().sort((a,b)=>Number(a.stock)-Number(b.stock));
 return `${heading("Control de stock","Consultá existencias y detectá productos por reponer.")}
 ${toolbar(null,null)}
 ${table(["Producto","Código","Existencia","Mínimo","Estado","Acción"],items.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||"—")}</td><td>${p.stock}</td><td>${p.min||0}</td><td>${Number(p.stock)<=Number(p.min||0)?'<span class="badge low">Reponer</span>':'<span class="badge">Disponible</span>'}</td><td><button class="smallbtn" onclick="adjustStock('${p.id}')">Ajustar</button></td></tr>`).join(""))}`;
}
function ticketsPage(){
 return `${heading("Tickets","Consultá e imprimí los comprobantes de ventas registradas.")}
 ${table(["N.º","Fecha","Cliente","Detalle","Total","Acción"],db.sales.slice().reverse().map(s=>`<tr><td>${esc(s.id.slice(-7).toUpperCase())}</td><td>${new Date(s.date).toLocaleString("es-AR")}</td><td>${esc(s.clientName||"Venta general")}</td><td>${esc(s.productName)} × ${s.qty}</td><td>${money(s.total)}</td><td><button class="smallbtn" onclick="printTicket('${s.id}')">Imprimir</button></td></tr>`).join(""))}`;
}
function settingsPage(){
 return `${heading("Ajustes","Personalizá el negocio y respaldá tus datos.")}
 <section class="panel"><h2>Datos del negocio</h2><form onsubmit="saveSettings(event)">
 <div class="field"><label>Nombre del negocio</label><input id="businessName" required maxlength="80" value="${esc(db.settings.business)}"></div>
 <div class="field"><label>Símbolo de moneda</label><input id="currency" maxlength="5" value="${esc(db.settings.currency)}"></div>
 <button class="btn">Guardar ajustes</button></form></section>
 <section class="panel" style="margin-top:16px"><h2>Respaldo local</h2><p>Exportá los datos a un archivo JSON para guardarlo fuera del navegador. Importá un respaldo para restaurar los datos.</p>
 <div class="toolbar"><button class="btn" onclick="exportData()">${icon("i-download")} Exportar copia</button>
 <button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar copia</button>
 <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)"></div>
 <p class="muted">La importación reemplaza los datos locales actuales. Exportá una copia antes de importar.</p></section>
 <section class="panel" style="margin-top:16px"><h2>Almacenamiento</h2><p>Guardado en el navegador de este dispositivo.</p><span class="badge">LocalStorage activo</span><hr><button class="btn danger" onclick="clearData()">Borrar todos los datos locales</button></section>
 <div class="notice">Esta versión nueva está separada de la aplicación original. No modifica ni hereda automáticamente el control de licencias o la autenticación de Supabase del archivo original.</div>`;
}
function productForm(id){
 const p=db.products.find(x=>x.id===id)||{};
 document.getElementById("main").innerHTML=`${heading(id?"Editar producto":"Agregar producto","Completá los datos del producto.")}<section class="panel"><form onsubmit="saveProduct(event,'${id||""}')">
 <div class="field"><label>Nombre *</label><input id="pName" required maxlength="100" value="${esc(p.name||"")}"></div>
 <div class="formgrid"><div class="field"><label>Código</label><input id="pSku" maxlength="60" value="${esc(p.sku||"")}"></div><div class="field"><label>Categoría</label><input id="pCategory" maxlength="60" value="${esc(p.category||"")}"></div>
 <div class="field"><label>Precio de venta *</label><input id="pPrice" type="number" min="0" step=".01" required value="${p.price??""}"></div>
 <div class="field"><label>Stock actual *</label><input id="pStock" type="number" min="0" step="1" required value="${p.stock??0}"></div>
 <div class="field"><label>Stock mínimo para alertas</label><input id="pMin" type="number" min="0" step="1" value="${p.min??0}"></div></div>
 <div class="toolbar"><button class="btn">Guardar producto</button><button type="button" class="btn secondary" onclick="navigate('productos')">Cancelar</button></div></form></section>`;
}
function saveProduct(e,id){
 e.preventDefault();const old=db.products.find(p=>p.id===id);
 const p={id:id||uid(),name:document.getElementById("pName").value.trim(),sku:document.getElementById("pSku").value.trim(),category:document.getElementById("pCategory").value.trim(),price:Number(document.getElementById("pPrice").value),stock:Number(document.getElementById("pStock").value),min:Number(document.getElementById("pMin").value||0)};
 if(!p.name||p.price<0||p.stock<0||p.min<0)return alert("Revisá los datos ingresados.");
 if(old)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);
 if(saveDB())navigate("productos");
}
function clientForm(id){
 const c=db.clients.find(x=>x.id===id)||{};
 document.getElementById("main").innerHTML=`${heading(id?"Editar cliente":"Agregar cliente","Los datos se guardan en este celular.")}<section class="panel"><form onsubmit="saveClient(event,'${id||""}')">
 <div class="field"><label>Nombre completo *</label><input id="cName" required maxlength="100" value="${esc(c.name||"")}"></div>
 <div class="formgrid"><div class="field"><label>Teléfono</label><input id="cPhone" type="tel" maxlength="40" value="${esc(c.phone||"")}"></div><div class="field"><label>Correo</label><input id="cEmail" type="email" maxlength="100" value="${esc(c.email||"")}"></div></div>
 <div class="field"><label>Dirección / notas</label><textarea id="cNotes" rows="3" maxlength="500">${esc(c.notes||"")}</textarea></div>
 <div class="toolbar"><button class="btn">Guardar cliente</button><button type="button" class="btn secondary" onclick="navigate('clientes')">Cancelar</button></div></form></section>`;
}
function saveClient(e,id){
 e.preventDefault();const c={id:id||uid(),name:document.getElementById("cName").value.trim(),phone:document.getElementById("cPhone").value.trim(),email:document.getElementById("cEmail").value.trim(),notes:document.getElementById("cNotes").value.trim()};
 if(!c.name)return alert("Ingresá el nombre.");
 if(id)db.clients=db.clients.map(x=>x.id===id?c:x);else db.clients.push(c);
 if(saveDB())navigate("clientes");
}
function deleteItem(type,id){
 const item=db[type].find(x=>x.id===id);
 if(!item||!confirm(`¿Eliminar "${item.name}"? Esta acción no se puede deshacer.`))return;
 db[type]=db[type].filter(x=>x.id!==id);if(saveDB())render();
}
function adjustStock(id){
 const p=db.products.find(x=>x.id===id);if(!p)return;
 const val=prompt(`Stock actual de ${p.name}: ${p.stock}\nIngresá la nueva cantidad total:`,p.stock);
 if(val===null)return;const n=Number(val);
 if(!Number.isInteger(n)||n<0)return alert("Ingresá una cantidad entera igual o mayor que cero.");
 p.stock=n;if(saveDB())render();
}
function createSale(e){
 e.preventDefault();const p=db.products.find(x=>x.id===document.getElementById("saleProduct").value);
 const qty=Number(document.getElementById("saleQty").value);
 if(!p)return alert("Primero agregá un producto con stock disponible.");
 if(!Number.isInteger(qty)||qty<1)return alert("Ingresá una cantidad entera válida.");
 if(qty>p.stock)return alert("No hay suficiente stock. Disponible: "+p.stock);
 const c=db.clients.find(x=>x.id===document.getElementById("saleClient").value);
 const s={id:uid(),date:new Date().toISOString(),productId:p.id,productName:p.name,qty,price:Number(p.price),total:Number(p.price)*qty,clientName:c?c.name:"",payment:document.getElementById("salePayment").value};
 p.stock-=qty;db.sales.push(s);
 if(saveDB()){alert("Venta registrada correctamente.");navigate("ventas")}
}
function printTicket(id){
 const s=db.sales.find(x=>x.id===id);if(!s)return;
 const w=window.open("","_blank","width=420,height=650");
 if(!w)return alert("El navegador bloqueó la ventana. Permití las ventanas emergentes para imprimir el ticket.");
 w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Ticket</title><style>body{font:14px monospace;padding:20px;max-width:320px;margin:auto}h2{text-align:center}hr{border:0;border-top:1px dashed #777}.line{display:flex;justify-content:space-between;gap:10px}button{padding:10px;margin-top:15px}@media print{button{display:none}}</style></head><body><h2>${esc(db.settings.business)}</h2><p style="text-align:center">COMPROBANTE INTERNO</p><hr><p>N.º: ${esc(s.id.slice(-7).toUpperCase())}<br>Fecha: ${new Date(s.date).toLocaleString("es-AR")}<br>Cliente: ${esc(s.clientName||"Venta general")}</p><hr><p>${esc(s.productName)} × ${s.qty}</p><div class="line"><span>Precio unitario</span><span>${money(s.price)}</span></div><hr><div class="line"><b>TOTAL</b><b>${money(s.total)}</b></div><p>Pago: ${esc(s.payment)}</p><hr><p style="text-align:center">¡Gracias por tu compra!</p><button onclick="window.print()">Imprimir</button></body></html>`);
 w.document.close();
}
function saveSettings(e){
 e.preventDefault();db.settings.business=document.getElementById("businessName").value.trim()||"Mi negocio";db.settings.currency=document.getElementById("currency").value.trim()||"$";
 if(saveDB())render();
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="negocio-alerta-respaldo-"+new Date().toISOString().slice(0,10)+".json";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(e){
 const f=e.target.files[0];if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const d=JSON.parse(reader.result);
   if(!d||!Array.isArray(d.products)||!Array.isArray(d.clients)||!Array.isArray(d.sales)||!d.settings)throw Error();
   if(!confirm("Esto reemplazará los datos actuales. ¿Continuar?"))return;
   db={...defaults,...d,settings:{...defaults.settings,...d.settings}};
   if(saveDB()){alert("Respaldo importado correctamente.");render()}
  }catch(err){alert("El archivo no parece ser un respaldo válido de Negocio Alerta 2.0.")}
  e.target.value="";
 };
 reader.readAsText(f);
}
function clearData(){
 if(!confirm("¿Seguro que querés borrar TODOS los productos, clientes, ventas y ajustes locales? Exportá una copia antes si necesitás conservarlos."))return;
 if(!confirm("Confirmación final: esta acción no se puede deshacer."))return;
 db=structuredClone(defaults);if(saveDB())navigate("inicio");
}
render();
</script>
</body>
</html>
