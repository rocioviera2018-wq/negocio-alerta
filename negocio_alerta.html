(() => {
  'use strict';

  const KEY = 'negocioAlertaPro_v2';

  let state = load();
  let page = 'home';
  let scannerStream = null;

  function defaultState(){
    return {
      business: 'Mi negocio',
      owner: '',
      logo: '',
      products: [],
      sales: [],
      orders: [],
      clients: []
    };
  }

  function load(){
    try{
      const saved = JSON.parse(localStorage.getItem(KEY));
      return saved || defaultState();
    }catch(error){
      return defaultState();
    }
  }

  function save(){
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
  }

  function esc(value){
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char]));
  }

  function money(value){
    return new Intl.NumberFormat('es-AR',{
      style:'currency',
      currency:'ARS',
      maximumFractionDigits:2
    }).format(Number(value) || 0);
  }

  function id(){
    return Date.now().toString(36) +
      Math.random().toString(36).slice(2,8);
  }

  function low(product){
    return Number(product.stock) <= Number(product.min || 0);
  }

  function profit(product){
    return Number(product.price || 0) -
           Number(product.cost || 0);
  }

  function setPage(newPage){
    stopScanner();
    page = newPage;

    document.querySelectorAll('[data-page]').forEach(button => {
      button.classList.toggle(
        'active',
        button.dataset.page === newPage
      );
    });

    render();
  }

  function card(title, body, extra = ''){
    return `
      <section class="card">
        <div class="row">
          <h2>${title}</h2>
          ${extra}
        </div>
        ${body}
      </section>
    `;
  }

  function list(items, callback){
    return items.length
      ? `<div class="list">${items.map(callback).join('')}</div>`
      : `<div class="empty">
           Todavía no hay registros. Podés agregar el primero.
         </div>`;
  }

  function imageHTML(product){
    if(product.image){
      return `
        <img
          class="product-image"
          src="${product.image}"
          alt="${esc(product.name)}"
        >
      `;
    }

    return `
      <div class="product-image"
           style="display:flex;align-items:center;justify-content:center;font-size:25px">
        📦
      </div>
    `;
  }

  function renderHeader(){

      logo.textContent = '🌿';

  }

  function render(){

  function prepareImageInputs(){
    const productImage = document.getElementById('productImage');

    if(productImage){
      productImage.addEventListener('change', event => {
        const file = event.target.files[0];
        if(!file) return;

        resizeImage(file, data => {
          document.getElementById('imageData').value = data;

          document.getElementById('productImagePreview').innerHTML = `
            <img
              class="product-image"
              src="${data}"
              alt="Vista previa"
            >
          `;
        });
      });
    }

    const logoFile = document.getElementById('logoFile');

    if(logoFile){
      logoFile.addEventListener('change', event => {
        const file = event.target.files[0];
        if(!file) return;

        resizeImage(file, data => {
          document.getElementById('logoData').value = data;

          document.getElementById('logoPreview').innerHTML = `
            <img

              alt="Vista previa del logo"
            >
          `;
        });
      });

  function resizeImage(file, callback){
    const reader = new FileReader();

    reader.onload = event => {
      const image = new Image();

      image.onload = () => {
        const maxSize = 700;
        let width = image.width;
        let height = image.height;

        if(width > height && width > maxSize){
          height = Math.round(height * maxSize / width);
          width = maxSize;
        }

        if(height >= width && height > maxSize){
          width = Math.round(width * maxSize / height);
          height = maxSize;
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext('2d');
        context.drawImage(image, 0, 0, width, height);

        callback(
          canvas.toDataURL('image/jpeg', 0.82)
        );
      };

      image.src = event.target.result;
    };

    reader.readAsDataURL(file);
  }

  function stopScanner(){
    if(scannerStream){
      scannerStream.getTracks().forEach(track => track.stop());
      scannerStream = null;
    }

    document.querySelectorAll('video').forEach(video => {
      video.srcObject = null;
    });
  }

  async function startScanner(videoId, messageId, callback){
    const video = document.getElementById(videoId);
    const message = document.getElementById(messageId);

    if(!video){
      return;
    }

    try{
      if(!('BarcodeDetector' in window)){
        message.textContent =
          'Este navegador no admite escaneo automático. Escribí el código manualmente.';
        return;
      }

      const detector = new BarcodeDetector({
        formats:[
          'ean_13',
          'ean_8',
          'upc_a',
          'upc_e',
          'code_128',
          'code_39'
        ]
      });

      scannerStream = await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:'environment'}
        },
        audio:false
      });

      video.srcObject = scannerStream;
      message.textContent = 'Buscando código...';

      const scan = async () => {
        if(!scannerStream) return;

        try{
          const codes = await detector.detect(video);

          if(codes.length){
            const code = codes[0].rawValue;

            message.textContent = `Código detectado: ${code}`;
            callback(code);
            stopScanner();
            return;
          }
        }catch(error){
          console.warn('No se pudo leer el código:', error);
        }

        requestAnimationFrame(scan);
      };

      scan();

    }catch(error){
      console.error(error);
      message.textContent =
        'No se pudo abrir la cámara. Revisá los permisos del navegador.';
    }
  }

        try{
          const imported = JSON.parse(reader.result);

          if(
            !imported ||
            !Array.isArray(imported.products) ||
            !Array.isArray(imported.sales)
          ){
            throw new Error('Respaldo inválido');
          }

          if(confirm(
            '¿Reemplazar los datos actuales con este respaldo?'
          )){
            state = {
              business:imported.business || 'Mi negocio',
              owner:imported.owner || '',
              logo:imported.logo || '',
              products:imported.products || [],
              sales:imported.sales || [],
              orders:imported.orders || [],
              clients:imported.clients || []
            };
