<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#005b4c">
<title>Negocio Alerta PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--green:#006b58;--deep:#003d35;--gold:#d9b44a;--bg:#eef7f3;--ink:#123d37;--muted:#6b8580;--red:#c74646}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
.hero{background:radial-gradient(circle at top right,#168c76,var(--deep) 68%);color:#fff;padding:20px 16px 24px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #003d3525}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:58px;height:58px;flex-shrink:0;border-radius:16px;object-fit:cover;background:#ffffff22;border:2px solid #ffffff55;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.brand h1{font-size:23px;margin:0}
.brand p{margin:4px 0 0;color:#cde8df;font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;background:#ffffff15;padding:12px;border:1px solid #ffffff20;border-radius:16px}
.wrap{max-width:900px;margin:auto;padding:14px 14px 100px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:4px 0 16px}
.stat,.card,.tile{background:#fff;border:1px solid #d4e8e1;border-radius:17px;box-shadow:0 3px 12px #164e4010}
.stat{padding:12px 10px;min-width:0}
.stat small{font-weight:700;font-size:11px;color:var(--muted)}
.stat strong{display:block;font-size:20px;margin-top:4px;overflow-wrap:anywhere}
.stat.red{border-color:#efc4c4}.stat.gold{border-color:#e5d39b}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.tile{padding:13px 6px;text-align:center;color:var(--ink);font-weight:700;cursor:pointer;min-height:76px}
.tile span{display:block;font-size:23px;margin-bottom:4px}
.tile.active{background:linear-gradient(145deg,#00836b,#00483e);color:#fff;border:2px solid var(--gold)}
.card{padding:16px;margin-bottom:13px;min-width:0}
.card h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.list{display:grid;gap:8px}
.item{padding:11px;border:1px solid #e1eee9;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.item>div{min-width:0;overflow-wrap:anywhere}
.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:3px}
.product-image{width:58px;height:58px;flex-shrink:0;object-fit:cover;border-radius:12px;border:1px solid #d4e8e1;background:#eef7f3}
.product-info{display:flex;align-items:center;gap:10px;min-width:0}
.product-info>div{min-width:0;overflow-wrap:anywhere}
button,.btn{border:0;border-radius:11px;padding:11px 13px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary,.btn.secondary{background:#e9f4ef;color:var(--green);border:1px solid #c9e2d8}
button.gold{background:var(--gold);color:#243e31}
button.wa{background:#25d366;color:#053b1a}
button.danger{background:#fff0f0;color:#a22;border:1px solid #f0caca}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:750;color:#456a62}
input,select,textarea{width:100%;min-width:0;padding:11px;border:1px solid #cfe1da;border-radius:10px;background:#fbfefd;color:var(--ink);font:inherit}
textarea{min-height:80px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#003e36;color:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5;border-top:2px solid var(--gold)}
.bottom button{background:transparent;padding:5px 3px;font-size:10px;color:#eaf8f3;flex:1}
.bottom button span{display:block;font-size:19px}
.bottom button.active{color:#f0d36d}
.notice{background:#e4f4ed;border-radius:12px;padding:11px;font-size:12px;color:#426d61}
.file-row{display:grid;gap:8px;margin-top:6px}
.file-row label.file-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px dashed var(--green);border-radius:11px;background:#e9f4ef;color:var(--green);font-weight:700;cursor:pointer;font-size:14px;text-align:center;width:100%}
.file-row input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.logo-preview{width:90px;height:90px;object-fit:cover;border-radius:18px;border:2px solid #cfe1da;background:#eef7f3}
#modal{position:fixed;inset:0;background:#000000a0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:460px;border:2px solid var(--gold)}
.modal-box h2{margin:0 0 10px;font-size:18px}
.ticket pre{white-space:pre-wrap;font:inherit;line-height:1.7;margin:10px 0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#003e36;color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-size:13px;max-width:90%;text-align:center;border:1px solid var(--gold)}
@media(min-width:650px){.nav{grid-template-columns:repeat(6,1fr)}.stats{gap:14px}.stat{padding:16px}.hero{padding-left:max(16px,calc((100% - 870px)/2));padding-right:max(16px,calc((100% - 870px)/2))}}
@media(max-width:390px){.brand h1{font-size:19px}.stats{gap:6px}.stat strong{font-size:16px}.stat{padding:9px 7px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>

<header class="hero">
  <div class="brand">
    <div class="logo" id="headerLogo">🌿</div>
    <div>
      <h1><span id="businessTitle">Negocio Alerta</span> <span style="color:#f1d46c">PRO♛</span></h1>
      <p>Tu negocio organizado, desde el celular.</p>
    </div>
  </div>
  <div class="bar">
    <div>
      <b id="welcome">Bienvenido/a</b>
      <div class="muted" style="color:#cde8df">Tu negocio, siempre en control.</div>
    </div>
    <button class="gold" id="logout">↪ Salir</button>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><small>📦 PRODUCTOS</small><strong id="statProducts">0</strong></div>
    <div class="stat red"><small>⚠️ STOCK BAJO</small><strong id="statLow">0</strong></div>
    <div class="stat gold"><small>📈 VENTAS</small><strong id="statSales">$ 0</strong></div>
  </div>

  <nav class="nav" id="mainNav">
    <button class="tile active" data-page="home"><span>⌂</span>Inicio</button>
    <button class="tile" data-page="products"><span>♙</span>Productos</button>
    <button class="tile" data-page="sales"><span>▤</span>Ventas</button>
    <button class="tile" data-page="orders"><span>📦</span>Pedidos</button>
    <button class="tile" data-page="clients"><span>♧</span>Clientes</button>
    <button class="tile" data-page="settings"><span>⚙</span>Ajustes</button>
  </nav>

  <div id="page"></div>
</main>

<nav class="bottom" id="bottomNav">
  <button class="active" data-page="home"><span>⌂</span>Inicio</button>
  <button data-page="products"><span>♙</span>Productos</button>
  <button data-page="sales"><span>▤</span>Ventas</button>
  <button data-page="orders"><span>📦</span>Pedidos</button>
  <button data-page="clients"><span>♧</span>Clientes</button>
  <button data-page="settings"><span>⚙</span>Ajustes</button>
</nav>

<script>
(() => {
'use strict';

const KEY='negocioAlertaPro_v6';
let state=load();
let page='home';
let modalText='';
let modalPhone='';
let modalSaleId='';

function defaultState(){
  return{
    business:'Mi negocio',
    owner:'',
    logo:'',
    whatsapp:'5493755222727',
    products:[],
    sales:[],
    orders:[],
    clients:[]
  };
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s||typeof s!=='object')return defaultState();
    return{...defaultState(),...s,
      products:Array.isArray(s.products)?s.products:[],
      sales:Array.isArray(s.sales)?s.sales:[],
      orders:Array.isArray(s.orders)?s.orders:[],
      clients:Array.isArray(s.clients)?s.clients:[]};
  }catch(e){return defaultState();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));render();return true;}
  catch(e){alert('No hay espacio suficiente para guardar.');return false;}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(v)||0);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function low(p){return Number(p.stock)<=Number(p.min||0);}
function profit(p){return Number(p.price||0)-Number(p.cost||0);}

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.remove(),3800);
}
function openModal(html){
  closeModal();
  const m=document.createElement('div');
  m.id='modal';
  m.innerHTML=`<div class="modal-box">${html}</div>`;
  document.body.appendChild(m);
}
function closeModal(){document.getElementById('modal')?.remove();}

/* =========================================================
   COMPARTIR — usa navigator.share (menú nativo Android)
   Sin URLs raras, sin whatsapp://, sin wa.me obligatorio
   ========================================================= */
function cleanPhone(p){return String(p||'').replace(/\D/g,'');}

async function compartirTexto(mensaje){
  copyText(mensaje, true);

  // Método 1: menú nativo de Android (muestra WhatsApp, Business, etc)
  if(navigator.share){
    try{
      await navigator.share({text: mensaje});
      return true;
    }catch(e){
      if(e && e.name === 'AbortError') return true;
      // si falla, seguimos al siguiente método
    }
  }

  // Método 2: wa.me (WhatsApp Web)
  const number = cleanPhone(state.whatsapp);
  const url = number
    ? `https://wa.me/${number}?text=${encodeURIComponent(mensaje)}`
    : `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
  window.location.href = url;
  return false;
}

async function compartirArchivo(blob, nombre, mensaje){
  const file = new File([blob], nombre, {type: blob.type || 'application/octet-stream'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], text: mensaje, title: nombre});
      return true;
    }catch(e){
      if(e && e.name === 'AbortError') return true;
    }
  }
  return false;
}

async function copyText(text, silent){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    if(!silent) toast('Copiado al portapapeles');
    return true;
  }catch(e){
    if(!silent) toast('No se pudo copiar');
    return false;
  }
}

/* =========================================================
   PDF
   ========================================================= */
function generarPDF(sale){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('Necesitás conexión a internet para generar PDF la primera vez.');
    return null;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a5'});
  const w = doc.internal.pageSize.getWidth();
  let y = 15;

  doc.setFontSize(16);
  doc.setFont('helvetica','bold');
  doc.setTextColor(0,107,88);
  doc.text(state.business || 'Mi negocio', w/2, y, {align:'center'});
  y += 7;
  doc.setFontSize(9);
  doc.setFont('helvetica','normal');
  doc.setTextColor(120);
  doc.text('COMPROBANTE INTERNO — NO FISCAL', w/2, y, {align:'center'});
  y += 3;
  doc.setDrawColor(200);
  doc.line(10, y, w-10, y);
  y += 8;

  doc.setTextColor(30);
  doc.setFontSize(10);
  doc.text('Fecha:', 10, y);
  doc.setFont('helvetica','bold');
  doc.text(String(sale.date||''), 30, y);
  y += 6;
  doc.setFont('helvetica','normal');
  doc.text('Cliente:', 10, y);
  doc.setFont('helvetica','bold');
  doc.text(String(sale.client || 'Consumidor final'), 30, y);
  y += 10;

  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('Detalle', 10, y);
  y += 6;
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text(`${String(sale.productName||'Producto')}  x${sale.qty||1}`, 10, y);
  doc.text(`${money(sale.price)} c/u`, w-10, y, {align:'right'});
  y += 8;
  doc.setDrawColor(200);
  doc.line(10, y, w-10, y);
  y += 8;

  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.text('TOTAL:', 10, y);
  doc.text(money(sale.total), w-10, y, {align:'right'});
  y += 15;
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text('¡Gracias por tu compra!', w/2, y, {align:'center'});

  return doc.output('blob');
}

function nombreArchivoPDF(sale){
  const f = String(sale.date||'').replace(/[\/:,\s]/g,'-');
  return `comprobante-${f}.pdf`;
}

async function descargarBlob(blob, nombre){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ return false; }
}

async function saveFile(name, mime, content){
  const blob = new Blob([content], {type: mime});
  const ok = await compartirArchivo(blob, name, '');
  if(ok) return;
  const desc = await descargarBlob(blob, name);
  if(desc) toast('Descarga iniciada');
  else toast('No se pudo descargar');
}

/* =========================================================
   Comprobante
   ========================================================= */
function receipt(saleId){
  const sale = state.sales.find(s=>s.id===saleId);
  if(!sale) return;

  modalSaleId = saleId;
  modalText =
`${state.business}
COMPROBANTE INTERNO — NO FISCAL
Fecha: ${sale.date}
Cliente: ${sale.client || 'Consumidor final'}

${sale.productName} × ${sale.qty}
Precio unitario: ${money(sale.price)}
TOTAL: ${money(sale.total)}

¡Gracias por tu compra!`;

  const cl = state.clients.find(c=>c.name.trim().toLowerCase() === String(sale.client||'').trim().toLowerCase());
  modalPhone = cl ? cl.phone : '';

  const logoHTML = state.logo
    ? `<img src="${state.logo}" alt="Logo" style="width:80px;height:80px;object-fit:cover;border-radius:15px">`
    : '<div style="font-size:40px">🌿</div>';

  openModal(`
    <div class="ticket">
      ${logoHTML}
      <h2>${esc(state.business)}</h2>
      <pre>${esc(modalText)}</pre>
    </div>
    <div class="actions noprint">
      <button class="wa" data-act="share-text">📤 Compartir texto (WhatsApp, etc.)</button>
      <button data-act="pdf-share">📄 Compartir PDF</button>
      <button class="secondary" data-act="pdf-down">⬇️ Descargar PDF</button>
      <button class="secondary" data-act="copy-modal">📋 Copiar texto</button>
      <button class="danger" data-act="close">Cerrar</button>
    </div>`);
}

async function compartirTextoComprobante(){
  const sale = state.sales.find(s=>s.id===modalSaleId);
  if(!sale){ toast('Venta no encontrada'); return; }
  const numero = cleanPhone(modalPhone) || cleanPhone(state.whatsapp);
  const textoConNumero = numero ? `Para: ${numero}\n\n${modalText}` : modalText;
  await compartirTexto(textoConNumero);
}

async function compartirPDFComprobante(){
  const sale = state.sales.find(s=>s.id===modalSaleId);
  if(!sale){ toast('Venta no encontrada'); return; }
  const blob = generarPDF(sale);
  if(!blob) return;
  const nombre = nombreArchivoPDF(sale);
  const ok = await compartirArchivo(blob, nombre, modalText);
  if(!ok){
    toast('Tu celu no permite compartir archivos. Se descargó.');
    await descargarBlob(blob, nombre);
  }
}

async function descargarPDFComprobante(){
  const sale = state.sales.find(s=>s.id===modalSaleId);
  if(!sale){ toast('Venta no encontrada'); return; }
  const blob = generarPDF(sale);
  if(!blob) return;
  const ok = await descargarBlob(blob, nombreArchivoPDF(sale));
  if(ok) toast('PDF descargado');
}

/* =========================================================
   Resumen
   ========================================================= */
async function shareSummary(){
  const total = state.sales.reduce((s,x)=>s+Number(x.total||0),0);
  const msg =
`Resumen de ${state.business}
Ventas registradas: ${state.sales.length}
Total vendido: ${money(total)}
Productos: ${state.products.length}
Stock bajo: ${state.products.filter(low).length}`;
  await compartirTexto(msg);
}

/* =========================================================
   Navegación
   ========================================================= */
function setPage(next){
  page = next;
  document.querySelectorAll('[data-page]').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === next);
  });
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function card(title, body){ return `<section class="card"><h2>${title}</h2>${body}</section>`; }
function list(items, fn){
  return items.length
    ? `<div class="list">${items.map(fn).join('')}</div>`
    : '<div class="empty">Todavía no hay registros.</div>';
}
function imageHTML(p){
  return p.image
    ? `<img class="product-image" src="${p.image}" alt="${esc(p.name)}">`
    : '<div class="product-image" style="display:flex;align-items:center;justify-content:center;font-size:25px">📦</div>';
}
function renderHeader(){
  document.getElementById('welcome').textContent = state.owner ? `Bienvenido/a, ${state.owner}` : 'Bienvenido/a';
  document.getElementById('businessTitle').textContent = state.business || 'Negocio Alerta';
  const logo = document.getElementById('headerLogo');
  logo.innerHTML = state.logo
    ? `<img src="${state.logo}" alt="Logo" style="width:100%;height:100%;object-fit:cover">`
    : '🌿';
}

/* =========================================================
   Imágenes (solo galería)
   ========================================================= */
function filePickerHTML(idBase, label){
  return `
    <div class="file-row">
      <label class="file-btn" for="${idBase}_gal">🖼️ ${label} — Galería / Archivos</label>
      <input id="${idBase}_gal" type="file" accept="image/*" data-img-input="${idBase}">
    </div>`;
}
function attachImageInputs(){
  document.querySelectorAll('[data-img-input]').forEach(input=>{
    if(input.dataset.bound === '1') return;
    input.dataset.bound = '1';
    input.addEventListener('change', e=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const base = input.dataset.imgInput;
      resizeImage(file, data=>{
        const hidden = document.getElementById(base+'_data');
        const preview = document.getElementById(base+'_preview');
        if(hidden) hidden.value = data;
        if(preview){
          if(base === 'logoImg'){
            preview.innerHTML = `<img class="logo-preview" src="${data}" alt="Vista previa">`;
          }else{
            preview.innerHTML = `<img class="product-image" src="${data}" alt="Vista previa" style="margin-top:6px">`;
          }
        }
      });
      input.value = '';
    });
  });
}
function resizeImage(file, callback){
  if(!file || !file.type.startsWith('image/')){ alert('Elegí una imagen válida.'); return; }
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 700;
      const ratio = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * ratio));
      const h = Math.max(1, Math.round(img.height * ratio));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(c.toDataURL('image/jpeg', 0.78));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  renderHeader();
  document.getElementById('statProducts').textContent = state.products.length;
  document.getElementById('statLow').textContent = state.products.filter(low).length;
  document.getElementById('statSales').textContent = money(state.sales.reduce((s,x)=>s+Number(x.total||0),0));
  const root = document.getElementById('page');

  if(page==='home'){
    root.innerHTML =
      card('🔔 Atención para hoy',
        state.products.some(low)
          ? list(state.products.filter(low), p=>`
            <div class="item">
              <div class="product-info">${imageHTML(p)}<div>
                <strong>${esc(p.name)}</strong>
                <small>Quedan: ${p.stock} · Mínimo: ${p.min||0}</small>
              </div></div>
              <b style="color:#b33">Stock bajo</b>
            </div>`)
          : '<div class="notice">¡Todo bien! No hay productos por debajo del stock mínimo.</div>'
      ) +
      card('🕘 Últimos movimientos',
        list([
          ...state.sales.slice(-3).reverse().map(s=>({label:'Venta registrada', detail:s.client||'Cliente ocasional', value:money(s.total)})),
          ...state.orders.slice(-2).reverse().map(o=>({label:'Pedido', detail:o.client||'Cliente', value:o.status||'Pendiente'}))
        ], x=>`<div class="item"><div><strong>${esc(x.label)}</strong><small>${esc(x.detail)}</small></div><b>${esc(x.value)}</b></div>`)
      ) +
      '<div class="notice">📄 Los comprobantes se comparten como PDF o texto con el menú nativo del celular.</div>';
  }

  if(page==='products'){
    root.innerHTML =
      card('➕ Agregar producto', `
        <form id="productForm" class="form">
          <div class="field full">
            <label>Nombre del producto</label>
            <input name="name" required placeholder="Ej. Pan lactal">
          </div>
          <div class="field full">
            <label>Foto del producto (opcional)</label>
            ${filePickerHTML('prodImg','Foto')}
            <input type="hidden" name="imageData" id="prodImg_data">
            <div id="prodImg_preview"></div>
          </div>
          <div class="field">
            <label>Código de barras (opcional)</label>
            <input name="barcode" placeholder="Código">
          </div>
          <div class="field">
            <label>Stock mínimo</label>
            <input name="min" type="number" min="0" step="1" value="3">
          </div>
          <div class="field"><label>Precio de costo ($)</label><input name="cost" type="number" min="0" step="0.01" value="0" required></div>
          <div class="field"><label>Precio de venta ($)</label><input name="price" type="number" min="0" step="0.01" required></div>
          <div class="field"><label>Stock actual</label><input name="stock" type="number" min="0" step="1" value="0" required></div>
          <div class="field full"><button>Guardar producto</button></div>
        </form>
      `) +
      card('📦 Mis productos',
        list(state.products, p=>`
          <div class="item">
            <div class="product-info">${imageHTML(p)}<div>
              <strong>${esc(p.name)}</strong>
              <small>Costo: ${money(p.cost)} · Venta: ${money(p.price)}</small>
              <small>Ganancia: ${money(profit(p))} · Stock: ${p.stock}${low(p)?' · ⚠️ Bajo':''}</small>
            </div></div>
            <button class="danger" data-del-product="${p.id}">Eliminar</button>
          </div>`));
  }

  if(page==='sales'){
    root.innerHTML =
      card('🧾 Registrar venta', `
        <form id="saleForm" class="form">
          <div class="field full">
            <label>Producto</label>
            <select name="product" required>
              <option value="">Seleccioná un producto</option>
              ${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} — stock ${p.stock}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Cantidad</label><input name="qty" type="number" min="1" step="1" value="1" required></div>
          <div class="field">
            <label>Cliente opcional</label>
            <input name="client" placeholder="Nombre" list="clientList">
            <datalist id="clientList">${state.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
          </div>
          <div class="field full"><button ${state.products.length?'':'disabled'}>Registrar venta</button></div>
        </form>
        <p class="muted">Al registrar, se descuenta el stock automáticamente.</p>
      `) +
      card('💳 Historial de ventas',
        list(state.sales.slice().reverse(), s=>`
          <div class="item">
            <div>
              <strong>${esc(s.productName)} × ${s.qty}</strong>
              <small>${esc(s.date)} · ${esc(s.client||'Cliente ocasional')}</small>
            </div>
            <div style="text-align:right">
              <b>${money(s.total)}</b><br>
              <button class="secondary" data-receipt="${s.id}" style="margin-top:6px">Comprobante</button>
            </div>
          </div>`));
  }

  if(page==='orders'){
    root.innerHTML =
      card('➕ Nuevo pedido', `
        <form id="orderForm" class="form">
          <div class="field"><label>Cliente</label><input name="client" required></div>
          <div class="field"><label>Detalle del pedido</label><input name="detail" required></div>
          <div class="field"><label>Total estimado ($)</label><input name="total" type="number" min="0" step="0.01" value="0"></div>
          <div class="field"><label>Estado</label>
            <select name="status"><option>Pendiente</option><option>Preparando</option><option>Entregado</option><option>Cancelado</option></select>
          </div>
          <div class="field full"><button>Guardar pedido</button></div>
        </form>
      `) +
      card('📦 Pedidos',
        list(state.orders.slice().reverse(), o=>`
          <div class="item">
            <div><strong>${esc(o.client)} — ${esc(o.detail)}</strong><small>${money(o.total)} · ${esc(o.date)}</small></div>
            <div class="actions" style="margin:0">
              <select data-order-status="${o.id}">
                ${['Pendiente','Preparando','Entregado','Cancelado'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
              <button class="wa" data-order-share="${o.id}">Compartir</button>
            </div>
          </div>`));
  }

  if(page==='clients'){
    root.innerHTML =
      card('➕ Agregar cliente', `
        <form id="clientForm" class="form">
          <div class="field"><label>Nombre</label><input name="name" required></div>
          <div class="field"><label>WhatsApp</label><input name="phone" inputmode="tel" placeholder="549..."></div>
          <div class="field full"><label>Notas</label><textarea name="notes" placeholder="Preferencias, dirección, etc."></textarea></div>
          <div class="field full"><button>Guardar cliente</button></div>
        </form>
      `) +
      card('👥 Clientes',
        list(state.clients, c=>`
          <div class="item">
            <div><strong>${esc(c.name)}</strong><small>${esc(c.phone||'Sin teléfono')}</small>${c.notes?`<small>${esc(c.notes)}</small>`:''}</div>
            <div class="actions" style="margin:0">
              ${c.phone?`<button class="wa" data-client-share="${c.id}">Compartir</button>`:''}
              <button class="danger" data-del-client="${c.id}">Eliminar</button>
            </div>
          </div>`));
  }

  if(page==='settings'){
    root.innerHTML =
      card('⚙️ Datos del negocio', `
        <form id="settingsForm" class="form">
          <div class="field full">
            <label>Nombre del negocio</label>
            <input name="business" value="${esc(state.business)}" required>
          </div>
          <div class="field full">
            <label>Tu nombre</label>
            <input name="owner" value="${esc(state.owner)}">
          </div>
          <div class="field full">
            <label>WhatsApp predeterminado</label>
            <input name="whatsapp" value="${esc(state.whatsapp||'')}" inputmode="tel" placeholder="549...">
            <small class="muted">Solo números con código de país. Ej: 5493755222727</small>
          </div>
          <div class="field full">
            <label>Logo del negocio</label>
            ${filePickerHTML('logoImg','Logo')}
            <input type="hidden" name="logoData" id="logoImg_data">
            <div id="logoImg_preview">${state.logo?`<img class="logo-preview" src="${state.logo}" alt="Logo">`:'<span class="muted">Sin logo cargado.</span>'}</div>
          </div>
          <div class="field full"><button>Guardar ajustes</button></div>
        </form>
      `) +
      card('💾 Copia de seguridad', `
        <div class="actions">
          <button id="export">⬇️ Descargar respaldo</button>
          <button class="secondary" id="importBtn">⬆️ Subir respaldo</button>
          <input id="importFile" type="file" accept=".json,application/json,text/plain" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none">
        </div>
        <div class="actions">
          <button class="secondary" id="exportCSV">📊 Descargar ventas (CSV)</button>
          <button class="wa" id="shareSales">📤 Compartir resumen</button>
        </div>
      `) +
      card('🗑️ Borrar datos', `
        <button class="danger" id="clearAll">Borrar datos locales</button>
      `);
  }

  attachImageInputs();
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', async event=>{
  const target = event.target;

  const act = target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='close') closeModal();
    if(a==='share-text') await compartirTextoComprobante();
    if(a==='pdf-share') await compartirPDFComprobante();
    if(a==='pdf-down') await descargarPDFComprobante();
    if(a==='copy-modal') copyText(modalText);
    return;
  }

  if(target.id === 'modal'){ closeModal(); return; }

  const pageButton = target.closest('[data-page]');
  if(pageButton){ setPage(pageButton.dataset.page); return; }

  const delProduct = target.closest('[data-del-product]');
  if(delProduct){
    if(confirm('¿Eliminar este producto?')){
      state.products = state.products.filter(p=>p.id !== delProduct.dataset.delProduct);
      save();
    }
    return;
  }
  const delClient = target.closest('[data-del-client]');
  if(delClient){
    if(confirm('¿Eliminar este cliente?')){
      state.clients = state.clients.filter(c=>c.id !== delClient.dataset.delClient);
      save();
    }
    return;
  }

  const receiptButton = target.closest('[data-receipt]');
  if(receiptButton){ receipt(receiptButton.dataset.receipt); return; }

  const clientShare = target.closest('[data-client-share]');
  if(clientShare){
    const client = state.clients.find(c=>c.id === clientShare.dataset.clientShare);
    if(client){
      await compartirTexto(`Hola ${client.name}, te contactamos de ${state.business}.`);
    }
    return;
  }

  const orderShare = target.closest('[data-order-share]');
  if(orderShare){
    const o = state.orders.find(x=>x.id === orderShare.dataset.orderShare);
    if(o){
      await compartirTexto(
`Hola ${o.client}, tu pedido en ${state.business}:
${o.detail}
Total: ${money(o.total)}
Estado: ${o.status}`);
    }
    return;
  }

  if(target.closest('#export')){
    await saveFile('respaldo-negocio-alerta-pro.json','application/json',JSON.stringify(state,null,2));
    return;
  }
  if(target.closest('#exportCSV')){
    if(!state.sales.length){ alert('Todavía no hay ventas.'); return; }
    const rows=[['Fecha','Producto','Cantidad','Precio unitario','Total','Ganancia','Cliente']];
    state.sales.forEach(s=>rows.push([s.date,s.productName,s.qty,s.price,s.total,s.profit??'',s.client||'']));
    const csv='\uFEFF'+rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
    await saveFile('ventas-negocio-alerta-pro.csv','text/csv',csv);
    return;
  }
  if(target.closest('#importBtn')){
    document.getElementById('importFile')?.click();
    return;
  }
  if(target.closest('#shareSales')){ await shareSummary(); return; }
  if(target.closest('#clearAll')){
    if(confirm('¿Seguro? Se borrarán todos los datos.')){
      state = defaultState();
      save();
    }
    return;
  }
  if(target.closest('#logout')){
    alert('Los datos se guardan localmente.');
  }
});

document.addEventListener('submit', event=>{
  event.preventDefault();
  const form = event.target;
  const data = Object.fromEntries(new FormData(form));

  if(form.id==='productForm'){
    state.products.push({
      id: uid(),
      name: String(data.name||'').trim(),
      image: data.imageData || '',
      barcode: String(data.barcode||'').trim(),
      price: Number(data.price||0),
      cost: Number(data.cost||0),
      stock: Number(data.stock||0),
      min: Number(data.min||0)
    });
    if(save()) alert('Producto guardado.');
    return;
  }

  if(form.id==='saleForm'){
    const product = state.products.find(p=>p.id === data.product);
    const qty = Number(data.qty||0);
    if(!product){ alert('Seleccioná un producto.'); return; }
    if(qty<=0){ alert('Cantidad inválida.'); return; }
    if(qty > Number(product.stock)){ alert('Stock insuficiente. Disponible: ' + product.stock); return; }
    product.stock -= qty;
    state.sales.push({
      id: uid(),
      productId: product.id,
      productName: product.name,
      qty,
      cost: Number(product.cost||0),
      price: Number(product.price||0),
      profit: qty * profit(product),
      total: qty * Number(product.price||0),
      client: String(data.client||'').trim(),
      date: new Date().toLocaleString('es-AR')
    });
    if(save()) alert('Venta registrada.');
    return;
  }

  if(form.id==='orderForm'){
    state.orders.push({
      id: uid(),
      client: String(data.client||'').trim(),
      detail: String(data.detail||'').trim(),
      total: Number(data.total||0),
      status: data.status,
      date: new Date().toLocaleString('es-AR')
    });
    save();
    return;
  }

  if(form.id==='clientForm'){
    state.clients.push({
      id: uid(),
      name: String(data.name||'').trim(),
      phone: cleanPhone(data.phone),
      notes: String(data.notes||'').trim()
    });
    save();
    return;
  }

  if(form.id==='settingsForm'){
    state.business = String(data.business||'Mi negocio').trim();
    state.owner = String(data.owner||'').trim();
    state.whatsapp = cleanPhone(data.whatsapp);
    if(data.logoData) state.logo = data.logoData;
    if(save()) alert('Ajustes guardados.');
  }
});

document.addEventListener('change', event=>{
  const target = event.target;
  if(target.matches('[data-order-status]')){
    const order = state.orders.find(o=>o.id === target.dataset.orderStatus);
    if(order){ order.status = target.value; save(); }
  }
  if(target.id === 'importFile'){
    const file = target.files && target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(String(reader.result||''));
        if(imported && Array.isArray(imported.products)){
          if(confirm('¿Reemplazar datos con este respaldo?')){
            state = {...defaultState(), ...imported};
            save();
            alert('Respaldo importado.');
          }
        }else{
          alert('Archivo inválido.');
        }
      }catch(e){ alert('Archivo inválido.'); }
      target.value = '';
    };
    reader.readAsText(file);
  }
});

render();
})();
</script>
