<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar PDF y Compartir</title>
    <!-- Librería para generar PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <h2>Datos de la Venta</h2>
    
    <!-- Estos son los datos que irán en el PDF. Puedes cambiarlos por los de tu base de datos -->
    <input type="text" id="producto" placeholder="Producto" value="Camisa">
    <input type="number" id="cantidad" placeholder="Cantidad" value="2">
    <input type="number" id="total" placeholder="Total" value="150.50">
    
    <br><br>
    
    <!-- Botón que activa la función -->
    <button onclick="generarYCompartirPDF()" style="padding: 15px; font-size: 16px; background-color: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer;">
        📄 Generar PDF y Enviar por WhatsApp
    </button>

    <script>
        async function generarYCompartirPDF() {
            // 1. Capturar los datos de la pantalla
            const producto = document.getElementById('producto').value;
            const cantidad = document.getElementById('cantidad').value;
            const total = document.getElementById('total').value;

            // 2. Crear el PDF con jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Diseño del PDF (puedes personalizar esto)
            doc.setFontSize(18);
            doc.text("Recibo de Venta", 10, 20);
            doc.setFontSize(12);
            doc.text("Producto: " + producto, 10, 40);
            doc.text("Cantidad: " + cantidad, 10, 50);
            doc.text("Total: $" + total, 10, 60);
            doc.text("¡Gracias por su compra!", 10, 80);

            // 3. Convertir el PDF a un archivo (Blob)
            const pdfBlob = doc.output('blob');
            const file = new File([pdfBlob], 'recibo_venta.pdf', { type: 'application/pdf' });

            // 4. Intentar compartir por WhatsApp usando el menú nativo de Android
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Recibo de Venta',
                        text: 'Aquí tienes tu recibo en PDF.'
                    });
                } catch (error) {
                    console.error('Error al compartir:', error);
                    alert("Cancelaste el envío o hubo un error.");
                }
            } else {
                // 5. Plan B: Si la app no soporta compartir archivos, descarga el PDF y abre WhatsApp con un texto
                alert("Tu app actual no soporta compartir archivos directamente. Se descargará el PDF y se abrirá WhatsApp.");
                doc.save('recibo_venta.pdf'); // Descarga el PDF
                
                // Abre WhatsApp con un mensaje de texto (no adjunta el PDF automáticamente por seguridad de WhatsApp)
                const mensaje = encodeURIComponent("Hola, aquí está tu recibo de venta. Te adjunto el PDF que acabo de descargar.");
                window.open(`https://wa.me/?text=${mensaje}`, '_blank');
            }
        }
    </script>
</body>
</html>
