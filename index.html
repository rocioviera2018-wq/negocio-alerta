<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063c31">

<title>Negocio Alerta PRO</title>

<style>
:root{
    --verde:#064e3b;
    --verde2:#087f62;
    --verde3:#0ca77e;
    --verde-oscuro:#032d25;

    --dorado:#d4af37;
    --dorado2:#f0cf62;
    --dorado-suave:#fff7d9;

    --fondo:#f3f8f5;
    --blanco:#ffffff;
    --texto:#16342c;
    --gris:#71817b;
    --borde:#dce9e3;

    --rojo:#c9363e;
    --rojo-bg:#fff0f1;

    --sombra:0 10px 30px rgba(0,65,50,.10);
}

/* GENERAL */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--texto);

    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.08),
            transparent 280px
        ),
        linear-gradient(
            180deg,
            #e8f6f0 0,
            #f7faf8 420px
        );

    padding-bottom:85px;
}

/* HEADER */

header{
    position:relative;
    overflow:hidden;

    padding:24px 18px 30px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #022d25,
            #064e3b 45%,
            #087c60 100%
        );

    border-radius:0 0 32px 32px;

    box-shadow:
        0 12px 35px rgba(0,60,45,.25);
}

header:before{
    content:"";
    position:absolute;

    width:240px;
    height:240px;

    right:-100px;
    top:-130px;

    border:1px solid rgba(212,175,55,.28);

    border-radius:50%;
}

header:after{
    content:"";
    position:absolute;

    width:170px;
    height:170px;

    right:-40px;
    top:-80px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:50%;
}

.logo-header{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:2;
}

.logo-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            var(--dorado2),
            var(--dorado)
        );

    color:#173c31;

    font-size:27px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.18);
}

header h1{
    margin:0;

    font-size:25px;
    font-weight:850;

    letter-spacing:-.5px;
}

.pro{
    color:var(--dorado2);
}

header p{
    position:relative;
    z-index:2;

    margin:7px 0 0;

    color:#dceee8;

    font-size:14px;
}

/* CONTENEDOR */

.wrap{
    max-width:850px;

    margin:auto;

    padding:15px 14px 100px;
}

/* ESTADISTICAS */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;
}

.stat{
    position:relative;

    overflow:hidden;

    background:rgba(255,255,255,.98);

    border:
        1px solid var(--borde);

    border-radius:20px;

    padding:15px 13px;

    box-shadow:var(--sombra);
}

.stat:before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            var(--dorado),
            var(--dorado2)
        );
}

.stat:nth-child(2):before{
    background:var(--rojo);
}

.stat:nth-child(3):before{
    background:var(--verde2);
}

.stat small{
    color:var(--gris);

    font-size:12px;

    font-weight:750;
}

.stat strong{
    display:block;

    margin-top:5px;

    color:var(--verde);

    font-size:21px;
}

.stat:nth-child(2) strong{
    color:var(--rojo);
}

.stat:nth-child(3) strong{
    color:#947319;
}

/* MENU SUPERIOR */

.tabs{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin:16px 0;
}

.tabs button{
    min-height:66px;

    border:
        1px solid var(--borde);

    border-radius:17px;

    background:white;

    color:var(--texto);

    font-weight:800;

    font-size:13px;

    cursor:pointer;

    box-shadow:
        0 6px 18px rgba(0,60,45,.06);

    transition:.2s;
}

.tabs button:hover{
    transform:translateY(-2px);
}

.tabs button.active{
    color:white;

    border-color:var(--verde);

    background:
        linear-gradient
