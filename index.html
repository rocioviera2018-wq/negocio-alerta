<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#005b4c">
<title>Negocio Alerta PRO</title>
<style>
:root{--green:#006b58;--deep:#003d35;--gold:#d9b44a;--bg:#eef7f3;--ink:#123d37;--muted:#6b8580;--red:#c74646}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
.hero{background:radial-gradient(circle at top right,#168c76,var(--deep) 68%);color:#fff;padding:20px 16px 24px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #003d3525}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:58px;height:58px;flex-shrink:0;border-radius:16px;object-fit:cover;background:#ffffff22;border:2px solid #ffffff55;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.brand h1{font-size:23px;margin:0}
.brand p{margin:4px 0 0;color:#cde8df;font-size:13px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;background:#ffffff15;padding:12px;border:1px solid #ffffff20;border-radius:16px}
.wrap{max-width:900px;margin:auto;padding:14px 14px 100px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:4px 0 16px}
.stat,.card,.tile{background:#fff;border:1px solid #d4e8e1;border-radius:17px;box-shadow:0 3px 12px #164e4010}
.stat{padding:12px 10px;min-width:0}
.stat small{font-weight:700;font-size:11px;color:var(--muted)}
.stat strong{display:block;font-size:20px;margin-top:4px;overflow-wrap:anywhere}
.stat.red{border-color:#efc4c4}.stat.gold{border-color:#e5d39b}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.tile{padding:13px 6px;text-align:center;color:var(--ink);font-weight:700;cursor:pointer;min-height:76px}
.tile span{display:block;font-size:23px;margin-bottom:4px}
.tile.active{background:linear-gradient(145deg,#00836b,#00483e);color:#fff;border:2px solid var(--gold)}
.card{padding:16px;margin-bottom:13px;min-width:0}
.card h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.list{display:grid;gap:8px}
.item{padding:11px;border:1px solid #e1eee9;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.item>div{min-width:0;overflow-wrap:anywhere}
.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:3px}
.product-image{width:58px;height:58px;flex-shrink:0;object-fit:cover;border-radius:12px;border:1px solid #d4e8e1;background:#eef7f3}
.product-info{display:flex;align-items:center;gap:10px;min-width:0}
.product-info>div{min-width:0;overflow-wrap:anywhere}
button,.btn{border:0;border-radius:11px;padding:11px 13px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary,.btn.secondary{background:#e9f4ef;color:var(--green);border:1px solid #c9e2d8}
button.gold{background:var(--gold);color:#243e31}
button.wa{background:#25d366;color:#053b1a}
button.danger{background:#fff0f0;color:#a22;border:1px solid #f0caca}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:750;color:#456a62}
input,select,textarea{width:100%;min-width:0;padding:11px;border:1px solid #cfe1da;border-radius:10px;background:#fbfefd;color:var(--ink);font:inherit}
input[type=file]{font-size:13px;padding:9px}
textarea{min-height:80px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#003e36;color:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5;border-top:2px solid var(--gold)}
.bottom button{background:transparent;padding:5px 3px;font-size:10px;color:#eaf8f3;flex:1}
.bottom button span{display:block;font-size:19px}
.bottom button.active{color:#f0d36d}
.notice{background:#e4f4ed;border-radius:12px;padding:11px;font-size:12px;color:#426d61}
.hide{display:none!important}
.scanner-box{border:2px dashed var(--green);border-radius:14px;padding:12px;margin-top:10px;background:#f4fbf8}
.scanner-box video{width:100%;max-height:280px;object-fit:cover;border-radius:12px;background:#123d37}
.barcode-result{margin-top:8px;padding:9px;border-radius:9px;background:#e4f4ed;color:var(--green);font-weight:700}
.logo-preview{width:90px;height:90px;object-fit:cover;border-radius:18px;border:2px solid #cfe1da;background:#eef7f3}
.file-row{display:grid;gap:8px;margin-top:6px}
.file-row label.file-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px dashed var(--green);border-radius:11px;background:#e9f4ef;color:var(--green);font-weight:700;cursor:pointer;font-size:14px;text-align:center;width:100%}
.file-row input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#modal{position:fixed;inset:0;background:#000000a0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:460px;border:2px solid var(--gold)}
.modal-box h2{margin:0 0 10px;font-size:18px}
.ticket pre{white-space:pre-wrap;font:inherit;line-height:1.7;margin:10px 0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#003e36;color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-size:13px;max-width:90%;text-align:center;border:1px solid var(--gold)}
@media print{
  body>*:not(#modal){display:none!important}
  #modal{position:static;background:#fff;padding:0}
  .modal-box{border:1px solid #ccc;box-shadow:none}
  .noprint{display:none!important}
}
@media(min-width:650px){.nav{grid-template-columns:repeat(6,1fr)}.stats{gap:14px}.stat{padding:16px}.hero{padding-left:max(16px,calc((100% - 870px)/2));padding-right:max(16px,calc((100% - 870px)/2))}}
@media(max-width:390px){.brand h1{font-size:19px}.stats{gap:6px}.stat strong{font-size:16px}.stat{padding:9px 7px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>

<header class="hero">
  <div class="brand">
    <div class="logo" id="headerLogo">🌿</div>
    <div>
      <h1><span id="businessTitle">Negocio Alerta</span> <span style="color:#f1d46c">PRO♛</span></h1>
      <p>Tu negocio organizado, desde el celular.</p>
    </div>
  </div>
  <div class="bar">
    <div>
      <b id="welcome">Bienvenido/a</b>
      <div class="muted" style="color:#cde8df">Tu negocio, siempre en control.</div>
    </div>
    <button class="gold" id="logout">↪ Salir</button>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><small>📦 PRODUCTOS</small><strong id="statProducts">0</strong></div>
    <div class="stat red"><small>⚠️ STOCK BAJO</small><strong id="statLow">0</strong></div>
    <div class="stat gold"><small>📈 VENTAS</small><strong id="statSales">$ 0</strong></div>
  </div>

  <nav class="nav" id="mainNav">
    <button class="tile active" data-page="home"><span>⌂</span>Inicio</button>
    <button class="tile" data-page="products"><span>♙</span>Productos</button>
    <button class="tile" data-page="sales"><span>▤</span>Ventas</button>
    <button class="tile" data-page="orders"><span>📦</span>Pedidos</button>
    <button class="tile" data-page="clients"><span>♧</span>Clientes</button>
    <button class="tile" data-page="settings"><span>⚙</span>Ajustes</button>
  </nav>

  <div id="page"></div>
</main>

<nav class="bottom" id="bottomNav">
  <button class="active" data-page="home"><span>⌂</span>Inicio</button>
  <button data-page="products"><span>♙</span>Productos</button>
  <button data-page="sales"><span>▤</span>Ventas</button>
  <button data-page="orders"><span>📦</span>Pedidos</button>
  <button data-page="clients"><span>♧</span>Clientes</button>
  <button data-page="settings"><span>⚙</span>Ajustes</button>
</nav>

<script>
(() => {
'use strict';

const KEY='negocioAlertaPro_v3';
let state=load();
let page='home';
let scannerStream=null;
let scanActive=false;
let modalText='';
let modalPhone='';

function defaultState(){
  return{business:'Mi negocio',owner:'',logo:'',whatsapp:'',products:[],sales:[],orders:[],clients:[]};
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s||typeof s!=='object')return defaultState();
    return{...defaultState(),...s,
      products:Array.isArray(s.products)?s.products:[],
      sales:Array.isArray(s.sales)?s.sales:[],
      orders:Array.isArray(s.orders)?s.orders:[],
      clients:Array.isArray(s.clients)?s.clients:[]};
  }catch(e){return defaultState();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));render();return true;}
  catch(e){alert('No hay espacio suficiente para guardar. Probá con fotos más chicas.');return false;}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(v)||0);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function low(p){return Number(p.stock)<=Number(p.min||0);}
function profit(p){return Number(p.price||0)-Number(p.cost||0);}

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.remove(),3800);
}

/* -------- Modal interno -------- */
function openModal(html){
  closeModal();
  const m=document.createElement('div');
  m.id='modal';
  m.innerHTML=`<div class="modal-box">${html}</div>`;
  document.body.appendChild(m);
}
function closeModal(){document.getElementById('modal')?.remove();}

/* =========================================================
   WHATSAPP — apertura en cascada, compatible con TODO
   ========================================================= */
function cleanPhone(p){return String(p||'').replace(/\D/g,'');}

function openWhatsApp(message,phone=''){
  const number=cleanPhone(phone)||cleanPhone(state.whatsapp);
  const text=encodeURIComponent(message);

  // Respaldos en cascada
  const urls=[];
  if(number){
    urls.push(`whatsapp://send?phone=${number}&text=${text}`);
    urls.push(`https://wa.me/${number}?text=${text}`);
    urls.push(`https://api.whatsapp.com/send?phone=${number}&text=${text}`);
  }else{
    urls.push(`whatsapp://send?text=${text}`);
    urls.push(`https://wa.me/?text=${text}`);
    urls.push(`https://api.whatsapp.com/send?text=${text}`);
    urls.push(`https://web.whatsapp.com/send?text=${text}`);
  }

  // Copiamos siempre por las dudas
  copyText(message,true);

  let i=0;
  const started=Date.now();

  function tryNext(){
    if(i>=urls.length){
      toast('No se pudo abrir WhatsApp. El mensaje quedó copiado.');
      return;
    }
    const url=urls[i++];

    // Detectar si el navegador sigue visible -> no se abrió nada
    const timer=setTimeout(()=>{
      if(document.visibilityState==='visible'&&Date.now()-started<4000){
        tryNext();
      }
    },1200);

    // Al volver a la pestaña, cancelamos el temporizador
    const onVis=()=>{
      if(document.visibilityState==='hidden'){
        clearTimeout(timer);
        document.removeEventListener('visibilitychange',onVis);
        window.removeEventListener('pagehide',onVis);
      }
    };
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('pagehide',onVis);

    try{
      const a=document.createElement('a');
      a.href=url;
      if(!url.startsWith('whatsapp:')){a.target='_blank';a.rel='noopener';}
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){
      window.location.href=url;
    }
  }

  tryNext();
}

async function copyText(text,silent){
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    if(!silent)toast('Copiado al portapapeles');
    return true;
  }catch(e){
    if(!silent)toast('No se pudo copiar automáticamente');
    return false;
  }
}

async function shareText(text,title){
  if(navigator.share){
    try{await navigator.share({title:title||state.business,text});return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  openWhatsApp(text,modalPhone);
}

/* =========================================================
   DESCARGA DE ARCHIVOS — compatible celular y escritorio
   ========================================================= */
async function saveFile(name,mime,content){
  const blob=new Blob([content],{type:mime});

  // 1) Web Share con archivo (mejor en móvil)
  try{
    const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}

  // 2) Descarga clásica
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Descarga iniciada: '+name);
  }catch(e){
    openModal(`
      <h2>Copiá el contenido</h2>
      <p class="muted">Tu navegador no permitió la descarga. Copiá este texto y guardalo como ${esc(name)}.</p>
      <textarea id="fallbackText" style="min-height:200px" readonly>${esc(content)}</textarea>
      <div class="actions">
        <button data-act="copy-fallback">Copiar todo</button>
        <button class="secondary" data-act="close">Cerrar</button>
      </div>`);
  }
}

function exportData(){
  saveFile('respaldo-negocio-alerta-pro.json','application/json',JSON.stringify(state,null,2));
}
function csvCell(v){const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportSalesCSV(){
  const rows=[['Fecha','Producto','Cantidad','Precio unitario','Total','Ganancia','Cliente']];
  state.sales.forEach(s=>rows.push([s.date,s.productName,s.qty,s.price,s.total,s.profit??'',s.client||'']));
  saveFile('ventas-negocio-alerta-pro.csv','text/csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}
function importFromText(text){
  try{
    const imported=JSON.parse(text);
    if(!imported||!Array.isArray(imported.products)||!Array.isArray(imported.sales)){
      throw new Error('Formato inválido');
    }
    if(confirm('¿Reemplazar los datos actuales con este respaldo?')){
      state={...defaultState(),...imported,
        products:imported.products||[],
        sales:imported.sales||[],
        orders:imported.orders||[],
        clients:imported.clients||[]};
      closeModal();
      if(save())alert('Respaldo importado correctamente.');
    }
  }catch(e){
    alert('El archivo no parece ser un respaldo válido de Negocio Alerta PRO.');
  }
}

/* -------- Navegación -------- */
function setPage(next){
  stopScanner();
  page=next;
  document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===next));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`;}
function list(items,fn){
  return items.length
    ? `<div class="list">${items.map(fn).join('')}</div>`
    : '<div class="empty">Todavía no hay registros. Podés agregar el primero.</div>';
}
function imageHTML(p){
  return p.image
    ? `<img class="product-image" src="${p.image}" alt="${esc(p.name)}">`
    : '<div class="product-image" style="display:flex;align-items:center;justify-content:center;font-size:25px">📦</div>';
}
function renderHeader(){
  document.getElementById('welcome').textContent=state.owner?`Bienvenido/a, ${state.owner}`:'Bienvenido/a';
  document.getElementById('businessTitle').textContent=state.business||'Negocio Alerta';
  const logo=document.getElementById('headerLogo');
  logo.innerHTML=state.logo?`<img src="${state.logo}" alt="Logo" style="width:100%;height:100%;object-fit:cover">`:'🌿';
}

/* =========================================================
   GALERÍA / CÁMARA — inputs visibles, doble vía
   ========================================================= */
function filePickerHTML(idBase,label){
  return `
    <div class="file-row">
      <label class="file-btn" for="${idBase}_gal">
        🖼️ ${label} — Galería / Archivos
      </label>
      <input id="${idBase}_gal" type="file" accept="image/*" data-img-input="${idBase}">

      <label class="file-btn" for="${idBase}_cam">
        📸 ${label} — Sacar foto
      </label>
      <input id="${idBase}_cam" type="file" accept="image/*" capture="environment" data-img-input="${idBase}">
    </div>`;
}

function attachImageInputs(){
  document.querySelectorAll('[data-img-input]').forEach(input=>{
    if(input.dataset.bound==='1')return;
    input.dataset.bound='1';
    input.addEventListener('change',e=>{
      const file=e.target.files&&e.target.files[0];
      if(!file)return;
      const base=input.dataset.imgInput;
      resizeImage(file,data=>{
        const hidden=document.getElementById(base+'_data');
        const preview=document.getElementById(base+'_preview');
        if(hidden)hidden.value=data;
        if(preview){
          if(base==='logoImg'){
            preview.innerHTML=`<img class="logo-preview" src="${data}" alt="Vista previa">`;
          }else{
            preview.innerHTML=`<img class="product-image" src="${data}" alt="Vista previa" style="margin-top:6px">`;
          }
        }
      });
      input.value='';
    });
  });
}

function resizeImage(file,callback){
  if(!file||!file.type.startsWith('image/')){alert('Elegí una imagen válida.');return;}
  const reader=new FileReader();
  reader.onerror=()=>alert('No se pudo leer el archivo.');
  reader.onload=ev=>{
    const img=new Image();
    img.onerror=()=>alert('No se pudo abrir la imagen.');
    img.onload=()=>{
      const max=700;
      const ratio=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*ratio));
      const h=Math.max(1,Math.round(img.height*ratio));
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      const ctx=c.getContext('2d');
      if(!ctx){alert('No se pudo procesar la imagen.');return;}
      ctx.drawImage(img,0,0,w,h);
      callback(c.toDataURL('image/jpeg',0.78));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* -------- Escáner de barras -------- */
function stopScanner(){
  scanActive=false;
  if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}
  document.querySelectorAll('video').forEach(v=>v.srcObject=null);
}
async function startScanner(videoId,messageId,callback){
  stopScanner();
  const video=document.getElementById(videoId);
  const message=document.getElementById(messageId);
  if(!video||!message)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    message.textContent='La cámara requiere HTTPS y permisos del navegador.';
    return;
  }
  if(!('BarcodeDetector' in window)){
    message.textContent='Este navegador no admite escaneo automático. Escribí el código manualmente.';
    return;
  }
  try{
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=scannerStream;
    await video.play();
    scanActive=true;
    message.textContent='Buscando código...';
    const scan=async()=>{
      if(!scanActive||!scannerStream)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          const code=codes[0].rawValue;
          message.textContent='Código detectado: '+code;
          scanActive=false;stopScanner();callback(code);return;
        }
      }catch(e){}
      if(scanActive)requestAnimationFrame(scan);
    };
    scan();
  }catch(e){
    stopScanner();
    message.textContent='No se pudo abrir la cámara. Revisá los permisos.';
  }
}
function findProductByBarcode(bc){
  return state.products.find(p=>String(p.barcode||'').trim()===String(bc).trim());
}

/* -------- Comprobante -------- */
function receipt(saleId){
  const sale=state.sales.find(s=>s.id===saleId);
  if(!sale)return;
  modalText=
`${state.business}
COMPROBANTE INTERNO — NO FISCAL
Fecha: ${sale.date}
Cliente: ${sale.client||'Consumidor final'}

${sale.productName} × ${sale.qty}
Precio unitario: ${money(sale.price)}
TOTAL: ${money(sale.total)}

¡Gracias por tu compra!`;
  const cl=state.clients.find(c=>c.name.trim().toLowerCase()===String(sale.client||'').trim().toLowerCase());
  modalPhone=cl?cl.phone:'';
  const logoHTML=state.logo
    ? `<img src="${state.logo}" alt="Logo" style="width:80px;height:80px;object-fit:cover;border-radius:15px">`
    : '<div style="font-size:40px">🌿</div>';
  openModal(`
    <div class="ticket">
      ${logoHTML}
      <h2>${esc(state.business)}</h2>
      <pre>${esc(modalText)}</pre>
      <p class="muted">Comprobante interno; no es una factura fiscal.</p>
    </div>
    <div class="actions noprint">
      <button class="wa" data-act="wa-modal">💬 WhatsApp</button>
      <button data-act="share-modal">📤 Compartir</button>
      <button class="secondary" data-act="copy-modal">📋 Copiar</button>
      <button class="secondary" data-act="txt-modal">⬇️ Descargar .txt</button>
      <button class="secondary" data-act="print-modal">🖨️ Imprimir / PDF</button>
      <button class="danger" data-act="close">Cerrar</button>
    </div>`);
}
function shareSummary(){
  const total=state.sales.reduce((s,x)=>s+Number(x.total||0),0);
  const msg=
`Resumen de ${state.business}
Ventas registradas: ${state.sales.length}
Total vendido: ${money(total)}
Productos: ${state.products.length}
Stock bajo: ${state.products.filter(low).length}`;
  openWhatsApp(msg);
}

   RENDER

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click',event=>{
  const target=event.target;

  // Acciones del modal
  const act=target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='close')closeModal();
    if(a==='wa-modal')openWhatsApp(modalText,modalPhone);
    if(a==='share-modal')shareText(modalText,'Comprobante');
    if(a==='copy-modal')copyText(modalText);
    if(a==='txt-modal')saveFile('comprobante.txt','text/plain',modalText);
    if(a==='print-modal')window.print();
    if(a==='copy-fallback'){const t=document.getElementById('fallbackText');if(t)copyText(t.value);}
    if(a==='import-pasted'){const t=document.getElementById('pasteArea');if(t&&t.value.trim())importFromText(t.value);else toast('Pegá primero el contenido');}
    return;
  }

  if(target.id==='modal'){closeModal();return;}

  const pageButton=target.closest('[data-page]');
  if(pageButton){setPage(pageButton.dataset.page);return;}

  const delProduct=target.closest('[data-del-product]');
  if(delProduct){
    if(confirm('¿Eliminar este producto?')){
      state.products=state.products.filter(p=>p.id!==delProduct.dataset.delProduct);
      save();
    }
    return;
  }

  const delClient=target.closest('[data-del-client]');
  if(delClient){
    if(confirm('¿Eliminar este cliente?')){
      state.clients=state.clients.filter(c=>c.id!==delClient.dataset.delClient);
      save();
    }
    return;
  }

  const receiptButton=target.closest('[data-receipt]');
  if(receiptButton){receipt(receiptButton.dataset.receipt);return;}

  const clientButton=target.closest('[data-client-whatsapp]');
  if(clientButton){
    const client=state.clients.find(c=>c.id===clientButton.dataset.clientWhatsapp);
    if(client){
      const phone=cleanPhone(client.phone);
      if(!phone){alert('Este cliente no tiene WhatsApp registrado.');return;}
      openWhatsApp(`Hola ${client.name}, te contactamos de ${state.business}.`,phone);
    }
    return;
  }

  const orderWa=target.closest('[data-order-wa]');
  if(orderWa){
    const o=state.orders.find(x=>x.id===orderWa.dataset.orderWa);
    if(o){
      const cl=state.clients.find(c=>c.name.trim().toLowerCase()===String(o.client||'').trim().toLowerCase());
      openWhatsApp(
`Hola ${o.client}, tu pedido en ${state.business}:
${o.detail}
Total: ${money(o.total)}
Estado: ${o.status}`,cl?cl.phone:'');
    }
    return;
  }

  if(target.closest('#openScannerProduct')){
    const box=document.getElementById('productScanner');
    if(box){
      box.classList.remove('hide');
      startScanner('scannerVideo','scannerMessage',bc=>{
        const input=document.getElementById('productBarcode');
        if(input)input.value=bc;
      });
    }
    return;
  }
  if(target.closest('#closeScannerProduct')){
    stopScanner();document.getElementById('productScanner')?.classList.add('hide');return;
  }
  if(target.closest('#openScannerSale')){
    const box=document.getElementById('saleScanner');
    if(box){
      box.classList.remove('hide');
      startScanner('saleScannerVideo','saleScannerMessage',bc=>{
        const p=findProductByBarcode(bc);
        if(!p){alert('No existe un producto con ese código. Agregalo primero.');return;}
        const sel=document.getElementById('saleProduct');
        if(sel)sel.value=p.id;
      });
    }
    return;
  }
  if(target.closest('#closeScannerSale')){
    stopScanner();document.getElementById('saleScanner')?.classList.add('hide');return;
  }

  if(target.closest('#export')){exportData();return;}
  if(target.closest('#exportCSV')){
    if(!state.sales.length){alert('Todavía no hay ventas para exportar.');return;}
    exportSalesCSV();return;
  }
  if(target.closest('#copyBackup')){copyText(JSON.stringify(state,null,2));return;}
  if(target.closest('#pasteBackup')){
    openModal(`
      <h2>Pegar respaldo</h2>
      <p class="muted">Pegá el contenido completo del archivo (JSON).</p>
      <textarea id="pasteArea" style="min-height:180px" placeholder='{"business": ...}'></textarea>
      <div class="actions">
        <button data-act="import-pasted">Importar</button>
        <button class="secondary" data-act="close">Cancelar</button>
      </div>`);
    return;
  }
  if(target.closest('#importBtn')){
    document.getElementById('importFile')?.click();
    return;
  }
  if(target.closest('#shareSales')){shareSummary();return;}
  if(target.closest('#clearAll')){
    if(confirm('¿Seguro? Se borrarán todos los datos locales. Descargá un respaldo si lo necesitás.')){
      state=defaultState();save();
    }
    return;
  }
  if(target.closest('#logout')){
    alert('Esta versión guarda datos localmente. El cierre de sesión real necesita un sistema de usuarios.');
  }
});

document.addEventListener('submit',event=>{
  event.preventDefault();
  const form=event.target;
  const data=Object.fromEntries(new FormData(form));

  if(form.id==='productForm'){
    const barcode=String(data.barcode||'').trim();
    if(barcode&&findProductByBarcode(barcode)){
      alert('Ya existe un producto con ese código de barras.');
      return;
    }
    state.products.push({
      id:uid(),
      name:String(data.name||'').trim(),
      image:data.imageData||'',
      barcode,
      price:Number(data.price||0),
      cost:Number(data.cost||0),
      stock:Number(data.stock||0),
      min:Number(data.min||0)
    });
    if(save())alert('Producto guardado correctamente.');
    return;
  }

  if(form.id==='saleForm'){
    const product=state.products.find(p=>p.id===data.product);
    const qty=Number(data.qty||0);
    if(!product){alert('Seleccioná un producto.');return;}
    if(qty<=0){alert('La cantidad debe ser mayor que cero.');return;}
    if(qty>Number(product.stock)){alert('No hay suficiente stock. Disponible: '+product.stock);return;}
    product.stock-=qty;
    state.sales.push({
      id:uid(),
      productId:product.id,
      productName:product.name,
      qty,
      cost:Number(product.cost||0),
      price:Number(product.price||0),
      profit:qty*profit(product),
      total:qty*Number(product.price||0),
      client:String(data.client||'').trim(),
      date:new Date().toLocaleString('es-AR')
    });
    if(save())alert('Venta registrada correctamente.');
    return;
  }

  if(form.id==='orderForm'){
    state.orders.push({
      id:uid(),
      client:String(data.client||'').trim(),
      detail:String(data.detail||'').trim(),
      total:Number(data.total||0),
      status:data.status,
      date:new Date().toLocaleString('es-AR')
    });
    save();
    return;
  }

  if(form.id==='clientForm'){
    state.clients.push({
      id:uid(),
      name:String(data.name||'').trim(),
      phone:cleanPhone(data.phone),
      notes:String(data.notes||'').trim()
    });
    save();
    return;
  }

  if(form.id==='settingsForm'){
    state.business=String(data.business||'Mi negocio').trim();
    state.owner=String(data.owner||'').trim();
    state.whatsapp=cleanPhone(data.whatsapp);
    if(data.logoData)state.logo=data.logoData;
    if(save())alert('Ajustes guardados correctamente.');
  }
});

document.addEventListener('change',event=>{
  const target=event.target;
  if(target.matches('[data-order-status]')){
    const order=state.orders.find(o=>o.id===target.dataset.orderStatus);
    if(order){order.status=target.value;save();}
  }
  if(target.id==='importFile'){
    const file=target.files&&target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onerror=()=>alert('No se pudo leer el archivo seleccionado.');
    reader.onload=()=>{importFromText(String(reader.result||''));target.value='';};
    reader.readAsText(file);
  }
});

render();
})();
</script>
