<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Negocio Alerta PRO</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--tx:#12302a;--mut:#5d716b;--g1:#0b3d33;--g2:#0f5a47;--acc:#f5b83d;--red:#d93a3a;--redbg:#fde8e8;--bd:#d6e2dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a17;--card:#16282a;--tx:#e6f1ed;--mut:#90a8a1;--bd:#25403a;--redbg:#3a1f1f}}
:root[data-theme="dark"]{--bg:#0d1a17;--card:#16282a;--tx:#e6f1ed;--mut:#90a8a1;--bd:#25403a;--redbg:#3a1f1f}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 14px 12px;border-radius:0 0 22px 22px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-size:34px}.top h1{margin:0;font-size:22px;line-height:1.1}
.pro{color:var(--acc);font-size:15px;margin-left:4px}
.sub{font-size:12px;opacity:.85}
.g{margin-left:auto;display:flex;gap:8px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:#fff;color:#4285f4;font-weight:700;display:grid;place-items:center}
.welcome{margin-top:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px}
.welcome .ic{font-size:26px;background:rgba(255,255,255,.12);border-radius:12px;padding:6px}
.welcome b{display:block}.welcome small{opacity:.85}
.btn{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:12px;padding:8px 12px;font-weight:600;margin-left:auto}
main{flex:1;overflow-y:auto;padding:14px 12px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1.5px solid #4ab39a;border-radius:16px;padding:10px;cursor:pointer}
.stat.low{border-color:#f2a3a3;background:var(--redbg)}.stat.gain{border-color:#efc66b}
.stat small{color:var(--mut);font-size:12px}.stat b{display:block;font-size:22px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 2px;text-align:center;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer}
.tile span{display:block;font-size:22px;margin-bottom:3px}
.tile.on{background:var(--g1);color:#fff;border:2px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.card h2 a{margin-left:auto;font-size:12px;font-weight:600;color:var(--g2);cursor:pointer}
.badge{display:inline-block;background:var(--redbg);color:var(--red);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.al{font-size:12px;text-align:center}.al .em{font-size:34px}.al b{display:block}.al .r{color:var(--red);font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}.row .t{margin-left:auto;color:var(--mut);font-size:12px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.pend{background:#fdeabc;color:#8a5a00;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.done{background:#d3f1e3;color:#116240;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.note{background:#e3f1ea;color:#3d5c52;border:1px solid #b9d9c9;border-radius:12px;padding:10px;font-size:11.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note{background:#18322b;color:#a9c8bd;border-color:#2b5247}}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{width:100%;background:var(--g2);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px}
.sm{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:5px 10px;font-size:13px}
nav{display:flex;background:linear-gradient(var(--g1),#08291f);border-top:2px solid var(--acc);border-radius:18px 18px 0 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#cfe3dc;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-bottom:2px solid transparent}
nav button span{font-size:20px}nav button.on{color:#fff;font-weight:700;border-bottom-color:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#12302a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style></head><body>
<header>
 <div class="top"><div class="logo">🌿</div><div><h1>Negocio Alerta <span class="pro">👑PRO</span></h1><div class="sub">Tu negocio organizado, desde el celular.</div></div>
 <div class="g"><span>🔔</span><div class="av">G</div></div></div>
 <div class="welcome"><div class="ic">🏪</div><div><b>Bienvenido/a</b><small>Tu negocio, siempre en control.</small></div><button class="btn" onclick="cerrar()">⎋ Cerrar</button></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const now=()=>new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const seed=()=>({view:'home',base:17900,
 products:[["Pan lactal","🍞",2,5,1200,700],["Jugo naranja","🧃",1,3,1500,900],["Papas fritas","🍟",2,5,1100,650],["Leche","🥛",20,6,1300,900],["Galletitas","🍪",14,5,900,500],["Gaseosa 1.5L","🥤",18,6,2200,1500],["Yerba","🧉",9,4,3200,2300],["Arroz 1kg","🍚",12,5,1500,1000],["Fideos","🍝",16,6,1100,700],["Aceite","🫒",7,3,2800,2000],["Azúcar","🧂",10,4,1200,800],["Huevos maple","🥚",8,3,4500,3300]].map((p,i)=>({id:i+1,name:p[0],em:p[1],stock:p[2],min:p[3],price:p[4],cost:p[5]})),
 sales:[{id:1,pid:1,qty:2,total:2400,profit:1000,t:"17:32"}],
 orders:[{id:1,client:"Ana",status:"Pendiente",t:"16:45"}],
 clients:[{id:1,name:"María García",t:"15:20"},{id:2,name:"Ana",t:"14:10"}],
 tickets:[],theme:'auto',ui:{}});
let S;try{S=JSON.parse(localStorage.getItem('na')||'null')}catch(e){}S=S||seed();
function save(){try{localStorage.setItem('na',JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function go(v){S.view=v;save();render();$('#main').scrollTop=0}
function cerrar(){toast('Sesión cerrada (demo)')}
const low=()=>S.products.filter(p=>p.stock<=p.min);
const gain=()=>S.base+S.sales.reduce((a,s)=>a+s.profit,0);
const pn=id=>(S.products.find(p=>p.id==id)||{name:'?'}).name;
const NAV=[["home","🏠","Inicio"],["products","👜","Productos"],["sales","💳","Ventas"],["orders","📦","Pedidos"],["clients","👥","Clientes"],["settings","⚙️","Ajustes"]];
const TILES=[["home","🏠","Inicio"],["products","👜","Productos"],["sales","💳","Ventas"],["orders","📦","Pedidos"],["clients","👥","Clientes y tickets"],["reports","📈","Reportes"],["settings","⚙️","Ajustes"]];
function home(){const l=low();
 const mov=[...S.sales.map(s=>({i:'+',c:'#1f9d6b',x:`Venta registrada - ${pn(s.pid)} x${s.qty}`,t:s.t,r:money(s.total)})),
  ...S.orders.map(o=>({i:'🛒',c:'#3b6fd4',x:`Pedido - Cliente: ${o.client}`,t:o.t,r:`<span class="${o.status=='Pendiente'?'pend':'done'}">${o.status}</span>`})),
  ...S.clients.map(c=>({i:'👤',c:'#7b4fc9',x:`Nuevo cliente - ${c.name}`,t:c.t,r:'—'}))].sort((a,b)=>b.t.localeCompare(a.t)).slice(0,4);
 return `<div class="stats">
 <div class="stat" onclick="go('products')"><small>📦 Productos</small><b>${S.products.length}</b></div>
 <div class="stat low" onclick="go('products')"><small>⚠️ Stock bajo</small><b style="color:var(--red)">${l.length}</b></div>
 <div class="stat gain" onclick="go('reports')"><small>📊 Ganancia</small><b>${money(gain())}</b></div></div>
 <div class="grid">${TILES.map(t=>`<div class="tile ${S.view==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</div>`).join('')}</div>
 <div class="card"><h2>🔔 Atención para hoy <a onclick="go('products')">Ver todos ›</a></h2>
 ${l.length?`<span class="badge">${l.length} productos con stock bajo</span><div class="alerts">${l.slice(0,3).map(p=>`<div class="al"><div class="em">${p.em}</div><b>${p.name}</b><span class="r">Quedan: ${p.stock}</span><br><small>Mínimo: ${p.min}</small></div>`).join('')}</div>`:'<div class="empty">Todo en orden ✅</div>'}</div>
 <div class="card"><h2>🕒 Últimos movimientos <a onclick="go('sales')">Ver todos ›</a></h2>
 ${mov.map(m=>`<div class="row"><div class="dot" style="background:${m.c}">${m.i}</div><b style="font-size:13px">${m.x}</b><span class="t">${m.t}</span><span style="min-width:62px;text-align:right;font-weight:700">${m.r}</span></div>`).join('')}</div>
 <div class="note">🛡️ Los datos se guardan en este navegador y, cuando hay sesión, se sincronizan con tu cuenta de Supabase. Los tickets son comprobantes internos, no facturas fiscales.</div>`}
function products(){return `<div class="card"><h2>👜 Agregar producto</h2>
 <input id="pn" placeholder="Nombre"><div class="two"><input id="pe" placeholder="Emoji 🍎" maxlength="2"><input id="ps" type="number" placeholder="Stock"></div>
 <div class="two"><input id="pm" type="number" placeholder="Stock mínimo"><input id="pp" type="number" placeholder="Precio venta"></div>
 <input id="pc" type="number" placeholder="Costo"><button class="pbtn" onclick="addP()">Guardar producto</button></div>
 <div class="card"><h2>Productos (${S.products.length})</h2>${S.products.map(p=>`<div class="row"><span style="font-size:26px">${p.em}</span><div><b>${p.name}</b><br><small style="color:var(--mut)">${money(p.price)} · mín ${p.min}</small></div><span class="t" style="margin-left:auto;${p.stock<=p.min?'color:var(--red);font-weight:700':''}">Stock ${p.stock}</span><button class="sm" onclick="stock(${p.id},1)">＋</button><button class="sm" onclick="stock(${p.id},-1)">－</button><button class="sm" onclick="delP(${p.id})">🗑</button></div>`).join('')}</div>`}
function addP(){const n=$('#pn').value.trim();if(!n)return toast('Falta el nombre');S.products.push({id:Date.now(),name:n,em:$('#pe').value||'📦',stock:+$('#ps').value||0,min:+$('#pm').value||0,price:+$('#pp').value||0,cost:+$('#pc').value||0});save();render();toast('Producto agregado')}
function stock(id,d){const p=S.products.find(p=>p.id==id);p.stock=Math.max(0,p.stock+d);save();render()}
function delP(id){S.products=S.products.filter(p=>p.id!=id);save();render()}
function sales(){return `<div class="card"><h2>💳 Registrar venta</h2>
 <select id="sp">${S.products.map(p=>`<option value="${p.id}">${p.em} ${p.name} (${p.stock}) — ${money(p.price)}</option>`).join('')}</select>
 <input id="sq" type="number" min="1" value="1"><button class="pbtn" onclick="sell()">Registrar venta</button></div>
 <div class="card"><h2>Historial</h2>${S.sales.length?[...S.sales].reverse().map(s=>`<div class="row"><div class="dot" style="background:#1f9d6b">+</div><b style="font-size:13px">${pn(s.pid)} x${s.qty}</b><span class="t">${s.t}</span><b>${money(s.total)}</b></div>`).join(''):'<div class="empty">Sin ventas</div>'}</div>`}
function sell(){const p=S.products.find(p=>p.id==$('#sp').value),q=+$('#sq').value;if(!p||q<1)return;if(q>p.stock)return toast('Stock insuficiente');
 p.stock-=q;const s={id:Date.now(),pid:p.id,qty:q,total:p.price*q,profit:(p.price-p.cost)*q,t:now()};S.sales.push(s);S.tickets.push({id:S.tickets.length+1,sid:s.id});save();render();toast('Venta registrada')}
function orders(){return `<div class="card"><h2>📦 Nuevo pedido</h2><input id="oc" placeholder="Cliente"><button class="pbtn" onclick="addO()">Crear pedido</button></div>
 <div class="card"><h2>Pedidos</h2>${S.orders.length?S.orders.map(o=>`<div class="row"><div class="dot" style="background:#3b6fd4">🛒</div><b>${o.client}</b><span class="t">${o.t}</span><span class="${o.status=='Pendiente'?'pend':'done'}" onclick="togO(${o.id})" style="cursor:pointer">${o.status}</span></div>`).join(''):'<div class="empty">Sin pedidos</div>'}</div>`}
function addO(){const c=$('#oc').value.trim();if(!c)return toast('Falta el cliente');S.orders.push({id:Date.now(),client:c,status:'Pendiente',t:now()});save();render()}
function togO(id){const o=S.orders.find(o=>o.id==id);o.status=o.status=='Pendiente'?'Entregado':'Pendiente';save();render()}
function clients(){return `<div class="card"><h2>👥 Nuevo cliente</h2><input id="cn" placeholder="Nombre"><button class="pbtn" onclick="addC()">Guardar cliente</button></div>
 <div class="card"><h2>Clientes (${S.clients.length})</h2>${S.clients.map(c=>`<div class="row"><div class="dot" style="background:#7b4fc9">👤</div><b>${c.name}</b><span class="t">${c.t}</span></div>`).join('')}</div>
 <div class="card"><h2>🎫 Tickets (${S.tickets.length})</h2>${S.tickets.length?[...S.tickets].reverse().map(t=>{const s=S.sales.find(s=>s.id==t.sid);return s?`<div class="row"><b>Ticket #${t.id}</b><span style="color:var(--mut);font-size:13px">${pn(s.pid)} x${s.qty}</span><b class="t" style="color:var(--tx)">${money(s.total)}</b></div>`:''}).join(''):'<div class="empty">Se generan al registrar ventas</div>'}<div class="note">Comprobante interno, no es factura fiscal.</div></div>`}
function addC(){const n=$('#cn').value.trim();if(!n)return toast('Falta el nombre');S.clients.push({id:Date.now(),name:n,t:now()});save();render()}
function reports(){const tot=S.sales.reduce((a,s)=>a+s.total,0),top={};S.sales.forEach(s=>top[s.pid]=(top[s.pid]||0)+s.qty);
 const arr=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=arr[0]?arr[0][1]:1;
 return `<div class="stats"><div class="stat"><small>Ventas</small><b>${S.sales.length}</b></div><div class="stat gain"><small>Ganancia</small><b style="font-size:17px">${money(gain())}</b></div><div class="stat"><small>Facturado</small><b style="font-size:17px">${money(tot)}</b></div></div>
 <div class="card" style="margin-top:12px"><h2>📈 Más vendidos</h2>${arr.map(([id,q])=>`<div style="margin-bottom:10px;font-size:14px"><div style="display:flex;justify-content:space-between"><span>${pn(id)}</span><b>${q}</b></div><div style="height:8px;border-radius:9px;background:var(--bd)"><div style="height:8px;border-radius:9px;background:var(--g2);width:${q/mx*100}%"></div></div></div>`).join('')||'<div class="empty">Sin datos</div>'}</div>`}
function settings(){return `<div class="card"><h2>⚙️ Ajustes</h2><label style="font-size:14px">Tema</label>
 <select onchange="S.theme=this.value;save();theme()"><option value="auto" ${S.theme=='auto'?'selected':''}>Automático</option><option value="light" ${S.theme=='light'?'selected':''}>Claro</option><option value="dark" ${S.theme=='dark'?'selected':''}>Oscuro</option></select>
 <button class="pbtn" style="background:var(--red)" onclick="S=seed();save();theme();render();toast('Datos restablecidos')">Restablecer datos de ejemplo</button></div>
 <div class="note">🛡️ Los datos se guardan en este navegador. Los tickets son comprobantes internos, no facturas fiscales.</div>`}
function theme(){const r=document.documentElement;S.theme=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
function render(){$('#main').innerHTML=({home,products,sales,orders,clients,reports,settings})[S.view]();
 $('#nav').innerHTML=NAV.map(n=>`<button class="${S.view==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
theme();render();
</script></body></html>
